<title>檔案分享</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,"Noto Sans TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}

<script>
// Nothing is stored in this browser: the password is used once to open the share and is not kept anywhere.
const $=s=>document.querySelector(s);
const id=location.hash.slice(1);let API='',files=[];
const fmtDT=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())};   // 24-hour clock, no seconds, everywhere
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const fmtTotal=n=>n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>0&&n<104858?'<0.1 MB':(n/1048576).toFixed(1)+' MB'; // GB from 1 GB up, otherwise MB
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function findApi(){try{const r=await fetch('url.json?t='+Date.now());API=(await r.json()).url.replace(/\/$/,'')}catch{API=''}}
// open(undefined) just asks whether a password is needed (shares made without one open straight away); open(pw) tries the password
async function openShare(pw){
  $('#go').disabled=true;$('#err').textContent='';
  try{
    if(!API)await findApi();
    if(!API)throw 0;
    const r=await fetch(API+'/api/share/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pw===undefined?{id}:{id,password:pw})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401&&j.needsPassword){$('#gsub').textContent='這份分享受密碼保護，請輸入分享者提供的密碼。';$('#form').hidden=false;$('#pw').focus();return}
    if(!r.ok){$('#gsub').textContent=pw===undefined?'':'這份分享受密碼保護，請輸入分享者提供的密碼。';if(pw===undefined)$('#form').hidden=true;$('#err').textContent=j.error||'無法開啟';$('#pw').value='';$('#pw').focus();return}
    $('#pw').value='';files=j.files;
    $('#gate').hidden=true;$('#app').hidden=false;
    $('#title').textContent=j.type==='folder'?'📁 '+j.title:`📄 分享的檔案（${files.length} 個）`;
    $('#sub').textContent=files.length+' 個檔案 · 共 '+fmtTotal(files.reduce((s,x)=>s+x.size,0))+(j.expires?' · 分享有效至 '+fmtDT(j.expires):'');
    document.title=j.type==='folder'?j.title+' - 檔案分享':'檔案分享';
    render();
  }catch{$('#gsub').textContent='';$('#err').textContent='連不到主機，可能是電腦沒開機，請稍後再試'}
  finally{$('#go').disabled=false}
}
addEventListener('hashchange',()=>location.reload()); // a different share link pasted into this tab must start fresh, never keep showing the previous share
const submitPw=()=>{const pw=$('#pw').value;if(pw)openShare(pw)};
if(!/^[A-Za-z0-9_-]{22}$/.test(id)){$('#gate').innerHTML='<h1>🔒 檔案分享</h1><p class="sub">連結不完整或已失效。</p>'}
else{$('#go').onclick=submitPw;$('#pw').onkeydown=e=>{if(e.key==='Enter')submitPw()};openShare()}

let view='nine',sortBy='date',asc=false,selMode=false;const selected=new Set();
const cmpName=(a,b)=>a.name.localeCompare(b.name,'zh-Hant',{numeric:true});
const CMP={name:cmpName,date:(a,b)=>a.mtime-b.mtime,size:(a,b)=>a.size-b.size};
const sorted=()=>[...files].sort((a,b)=>(asc?1:-1)*CMP[sortBy](a,b)||cmpName(a,b));
function syncToolbar(){for(const[v,i]of[['list','#vlist'],['nine','#vnine'],['small','#vsmall']])$(i).classList.toggle('on',view===v);$('#sort').value=sortBy;$('#order').textContent=asc?'↑ 由小到大':'↓ 由大到小';$('#selmode').classList.toggle('on',selMode);if(window.glassSegSync)glassSegSync()}
const ICON={image:'🖼',video:'🎬',file:'📄'};
function thumbErr(img){const d=document.createElement('div');d.className='ico';d.textContent=img.dataset.k==='video'?'🎬':'🖼';img.replaceWith(d)}
function media(x,i){
  const inner=x.thumb?`<img class="ico" loading="lazy" decoding="async" data-k="${x.kind}" src="${API+x.thumb}" alt="" onerror="thumbErr(this)">`:`<div class="ico">${ICON[x.kind]}</div>`;
  return `<a class="thumbA" href="${API+x.url}" data-open="${i}">${inner}${x.kind==='video'?'<span class="play">▶</span>':''}</a>`;
}
function render(){
  syncToolbar();document.body.classList.toggle('selecting',selMode);
  const list=sorted();vlist=list;
  const items=list.map((x,i)=>{
    const sel=selected.has(x.url)?' sel':'';
    if(view!=='list')return `<div class="cell${sel}" data-i="${i}" title="${esc(x.name)}"><span class="chk"></span>${media(x,i)}<div class="cn">${esc(x.name)}</div></div>`;
    return `<div class="row${sel}" data-i="${i}"><span class="chk"></span>${media(x,i)}<div class="info"><a href="${API+x.url}" data-open="${i}">${esc(x.name)}</a><small>${fmt(x.size)} · 更新 ${new Date(x.mtime).toLocaleDateString()}</small></div><a class="btn dlrow" href="${API+x.url}&dl=1" style="padding:4px 10px">下載</a></div>`}).join('');
  $('#list').innerHTML=view==='list'?items:`<div class="nine${view==='small'?' small':''}">${items}</div>`;
  $('#selbar').hidden=!selMode;$('#selcount').textContent='已選 '+selected.size+' 個';$('#seldl').disabled=$('#selnone').disabled=!selected.size;
}
const setView=v=>{view=v;render()};
$('#vlist').onclick=()=>setView('list');$('#vnine').onclick=()=>setView('nine');$('#vsmall').onclick=()=>setView('small');
$('#sort').onchange=e=>{sortBy=e.target.value;asc=sortBy==='name';render()};$('#order').onclick=()=>{asc=!asc;render()};
$('#selmode').onclick=$('#dsel').onclick=()=>{selMode=!selMode;if(!selMode)selected.clear();render()};
{ // same select-mode layout as the home page (glass.css does the styling)
  const sbar=$('#selbar'),top=document.createElement('div'),bot=document.createElement('div');top.className='seltop';bot.className='selbot';
  $('#selexit').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';$('#selexit').setAttribute('aria-label','返回');
  $('#seldl').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M8 11l4 4 4-4"/><path d="M4.5 17v1.5A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V17"/></svg>';$('#seldl').setAttribute('aria-label','下載選取');
  top.append($('#selexit'),$('#selnone'),$('#seldl'));bot.append($('#selcount'));sbar.append(top,bot);
  const band=document.createElement('div');band.id='topband';band.style.cssText='background:#000;opacity:1;-webkit-backdrop-filter:none;backdrop-filter:none';band.setAttribute('aria-hidden','true');$('#app').appendChild(band);
}
$('#selexit').onclick=()=>{selMode=false;selected.clear();render()};
$('#selall').onclick=()=>{files.forEach(x=>selected.add(x.url));render()};$('#selnone').onclick=()=>{selected.clear();render()};
$('#seldl').onclick=async()=>{ // browsers may ask to allow multiple downloads the first time
  for(const x of files)if(selected.has(x.url)){const a=document.createElement('a');a.href=API+x.url+'&dl=1';document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,700))}
};
$('#list').onclick=e=>{
  if(selMode&&!e.target.closest('a.btn')){const it=e.target.closest('[data-i]');if(it){e.preventDefault();const x=vlist[+it.dataset.i];selected.has(x.url)?selected.delete(x.url):selected.add(x.url);render()}return}
  const a=e.target.closest('a[data-open]');
  if(a&&!(e.ctrlKey||e.metaKey||e.shiftKey)){e.preventDefault();openViewer(+a.dataset.open)}
};

// ---- in-page preview ----
let vlist=[],vi=0,vseq=0,vOpen=false;
const extOf=n=>(n.match(/\.([^.]+)$/)||[])[1]?.toLowerCase()||'';
function openViewer(i){vi=i;if(!vOpen){vOpen=true;history.pushState({viewer:1},'')}$('#viewer').hidden=false;document.body.style.overflow='hidden';vLock(true);showViewer()}
if(document.documentElement.classList.contains('ios')){
  const ic=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
  const ICN={back:ic('<path d="M15 5l-7 7 7 7"/>'),info:ic('<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/>'),dl:ic('<path d="M12 3.5v11M8 11l4 4 4-4"/><path d="M4.5 17v1.5A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V17"/>')};
  const top=document.querySelector('#viewer .vtop'),bot=document.createElement('div'),left=document.createElement('div');bot.id='vbot';left.className='vl';
  const set=(id,svg,label)=>{const b=$(id);b.classList.add('vc');b.innerHTML=svg;b.setAttribute('aria-label',label);b.title=label;return b};
  set('#vback',ICN.back,'返回');set('#vinfo',ICN.info,'檔案資訊');const dl=set('#vdl',ICN.dl,'下載');
  $('#vdlj').classList.add('vc2');
  const right=document.createElement('div');right.className='vr';right.append($('#vdlj'),$('#vinfo'));
  top.append($('#vback'),right);left.append(dl);bot.append(left);$('#viewer').append(bot);
}else $('#vback').hidden=true;
let lockY=0;const vLock=on=>{const b=document.body;if(on&&!b.classList.contains('vlock')){lockY=scrollY;b.style.top=-lockY+'px';b.classList.add('vlock')}else if(!on&&b.classList.contains('vlock')){b.classList.remove('vlock');b.style.top='';scrollTo(0,lockY)}};
function stopMedia(){for(const m of $('#vstage').querySelectorAll('video,audio')){m.pause();m.removeAttribute('src');m.load()}}
// file info panel (the ℹ️ button). Visitors only see facts about the file itself: no uploader, no folder, no upload time.
let vmeta={};
const fmtDur=s=>{if(!Number.isFinite(s))return'';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
function renderInfo(){
  const p=$('#vinfop');if(p.hidden||!vlist[vi])return;
  $('#viewer').style.setProperty('--vbar',document.querySelector('.vtop').getBoundingClientRect().bottom+6+'px'); // the toolbar can be one or two rows tall (and float with margins on iOS): keep the panel just below it
  const x=vlist[vi],ext=extOf(x.name),label=x.kind==='image'?'圖片':x.kind==='video'?'影片':ext==='mp3'||ext==='wav'?'音訊':ext==='pdf'?'PDF 文件':ext==='txt'?'文字檔':'檔案';
  const rows=[['名稱',x.name],['類型',label+(ext?'（'+ext.toUpperCase()+'）':'')],['大小',fmt(x.size)],['更新日期',fmtDT(x.mtime)]];
  if(vmeta.w&&vmeta.h)rows.push(['解析度',`${vmeta.w} × ${vmeta.h}（${(vmeta.w*vmeta.h/1e6).toFixed(1)} MP）`]);
  if(vmeta.dur)rows.push(['長度',fmtDur(vmeta.dur)]);
  if(x.preview)rows.push(['備註','HEIC 照片：預覽使用轉好的 JPG，下載的是原檔']);
  p.innerHTML='<h4>ℹ️ 檔案資訊</h4>'+rows.map(([a,b])=>`<div class="ir"><span class="ik">${a}</span><span class="iv">${esc(b)}</span></div>`).join('');
}
$('#vinfo').onclick=()=>{const p=$('#vinfop');p.hidden=!p.hidden;renderInfo()};
function showViewer(){
  const x=vlist[vi],seq=++vseq,st=$('#vstage'),u=API+x.url,ext=extOf(x.name);
  stopMedia();st.innerHTML='';vmeta={};renderInfo();
  $('#vtitle').textContent=x.name;$('#vpos').textContent=`${vi+1} / ${vlist.length}`;$('#vdl').href=u+'&dl=1';
  $('#vdlj').hidden=!x.preview;if(x.preview)$('#vdlj').href=API+x.preview+'&dl=1'; // HEIC/HEIF: viewed as a JPEG copy; "下載" still gives the untouched original
  $('#vprev').hidden=$('#vnext').hidden=vlist.length<2;
  const msg=(html,cls)=>{const d=document.createElement('div');d.className='vmsg '+(cls||'');d.innerHTML=html;st.append(d)};
  if(x.kind==='image'){
    const img=document.createElement('img');img.className='vimg';img.alt=x.name;if(x.thumb)img.src=API+x.thumb;st.append(img);
    const full=new Image();full.onload=()=>{if(seq===vseq){img.src=full.src;vmeta={w:full.naturalWidth,h:full.naturalHeight};renderInfo()}};full.src=x.preview?API+x.preview:u;
  }else if(x.kind==='video'){
    const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';if(x.thumb)v.poster=API+x.thumb;
    v.addEventListener('error',()=>{if(seq===vseq&&v.getAttribute('src'))msg('這個瀏覽器無法播放此影片格式，請按右上角「下載」。','warn')});
    v.addEventListener('loadedmetadata',()=>{if(seq===vseq){vmeta={w:v.videoWidth,h:v.videoHeight,dur:v.duration};renderInfo()}});
    // a big original (4K / HEVC phone video) stutters over the tunnel: use the converted 720p copy when it exists, otherwise start playing the original and switch once the copy is ready
    const swapTo=url=>{if(seq!==vseq||!st.contains(v)||v.seeking)return false;const t=v.currentTime,was=!v.paused;v.src=API+url;v.currentTime=t;if(was){const p=v.play();if(p&&p.catch)p.catch(()=>{})}return true};
    const askPrep=async(first)=>{try{const r=await fetch(API+x.url.replace('/api/sfile','/api/svprep'));if(!r.ok)return;const j=await r.json();
      if(j.state==='ready'){if(first){v.src=API+j.url;v.play().catch(()=>{})}else swapTo(j.url);return true}
      if(j.state==='processing'&&seq===vseq&&st.contains(v))return false;}catch{}return true};
    (async()=>{const ok=await askPrep(true);if(ok===true&&v.getAttribute('src'))return;if(!v.getAttribute('src')){v.src=u;st.append(v);v.play().catch(()=>{})}
      for(let i=0;i<40&&seq===vseq&&st.contains(v);i++){await new Promise(r=>setTimeout(r,3000));if(await askPrep(false)===true)break}})();
    if(!st.contains(v))st.append(v);
  }else if(ext==='mp3'||ext==='wav'){
    msg('<div class="big">🎵</div>'+esc(x.name));const a=document.createElement('audio');a.controls=true;a.addEventListener('loadedmetadata',()=>{if(seq===vseq){vmeta={dur:a.duration};renderInfo()}});a.src=u;st.append(a);a.play().catch(()=>{});
  }else if(ext==='pdf'){const fr=document.createElement('iframe');fr.src=u;st.append(fr)}
  else if(ext==='txt'){
    msg('載入中…');
    fetch(u).then(r=>r.text()).then(t=>{if(seq!==vseq)return;st.innerHTML='';const p=document.createElement('pre');p.textContent=t.length>300000?t.slice(0,300000)+'\n\n…（內容過長，只顯示前 300KB）':t;st.append(p)}).catch(()=>{if(seq===vseq){st.innerHTML='';msg('無法載入文字內容','warn')}});
  }else msg(`<div class="big">📄</div>${esc(x.name)}<br>${fmt(x.size)}<br>此檔案類型無法預覽，請按右上角「下載」。`);
}
function closeViewer(fromPop){if(!vOpen)return;vOpen=false;vseq++;stopMedia();$('#vstage').innerHTML='';$('#viewer').hidden=true;$('#vinfop').hidden=true;document.body.style.overflow='';vLock(false);if(!fromPop&&history.state?.viewer)history.back()}
const vgo=d=>{if(vlist.length<2)return;vi=(vi+d+vlist.length)%vlist.length;showViewer()};
$('#vclose').onclick=()=>closeViewer();$('#vback').onclick=()=>closeViewer();$('#vprev').onclick=()=>vgo(-1);$('#vnext').onclick=()=>vgo(1);
$('#vstage').onclick=e=>{if(e.target.id==='vstage')closeViewer()};
addEventListener('popstate',()=>closeViewer(true));
document.addEventListener('keydown',e=>{if(!vOpen)return;if(e.key==='Escape'){if(!$('#vinfop').hidden)$('#vinfop').hidden=true;else closeViewer()}else if(e.key==='ArrowLeft')vgo(-1);else if(e.key==='ArrowRight')vgo(1)});
let tx=0,ty=0,tOK=false; // swipe left/right anywhere on the picture / video to move between files
$('#viewer').addEventListener('touchstart',e=>{
  tOK=false;if(e.touches.length!==1)return;
  const t=e.target;if(t.closest('#vbot,.vtop,#vinfop,.vnav,button,a,audio,iframe,pre'))return;
  const v=t.closest('video');if(v&&e.touches[0].clientY>v.getBoundingClientRect().bottom-100)return; // the player's own control bar
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;tOK=true;
},{passive:true});
$('#viewer').addEventListener('touchcancel',()=>{tOK=false},{passive:true});
$('#viewer').addEventListener('touchend',e=>{
  if(!tOK)return;tOK=false;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)vgo(dx<0?1:-1);
},{passive:true});
</script></div><script>(function(){try{var inApp=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;if(!inApp)return;var b=document.getElementById('appback');b.hidden=false;document.body.classList.add('hasback');b.onclick=function(){if(history.length>1)history.back();else location.href='./'}}catch(e){}})();</script>
</body></html>
