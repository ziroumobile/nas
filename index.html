<script>
const $=s=>document.querySelector(s);let me=null,API='',folders=[];
// thumbnails: 480p on phones / tablets (iOS, Android), 720p on Windows / Mac
const thumbSrc=t=>API+t+(document.documentElement.classList.contains('ios')?'&res=480':'');
// macOS (Safari "Add to Dock"): a full-bleed icon gets a white plate behind it, so give Macs a squircle icon with its own transparent margin (iPhone keeps the full-bleed one)
if(/Macintosh/.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1)){const l=document.querySelector('link[rel=apple-touch-icon]');if(l)l.href='icons/icon-mac-1024.png'}
const sb=supabase.createClient(NAS_CONFIG.supabaseUrl,NAS_CONFIG.supabaseAnonKey);
const fmtDT=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())};   // 24-hour clock, no seconds, everywhere
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
// totals: GB from 1 GB up, otherwise MB
const fmtTotal=n=>n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>0&&n<104858?'<0.1 MB':(n/1048576).toFixed(1)+' MB';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
// device name: user-editable, remembered per browser
const isIpadOS=navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1; // iPadOS asks for the desktop site and calls itself a Mac
function guessDevice(){const u=navigator.userAgent;
  return isIpadOS?'iPad':/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows 電腦':/Mac/.test(u)?'Mac':'未命名裝置'}
let device=ls.get('nas_device')||guessDevice();
if(isIpadOS&&device==='Mac'){device='iPad';ls.set('nas_device',device)} // earlier versions named an iPad "Mac"
const opened=new Set(JSON.parse(ls.get('nas_open')||'[]')); // folders start collapsed; only the ones you expanded stay open
async function dropLogin(){ // end THIS device's login only, even if Supabase no longer knows the session
  try{await sb.auth.signOut({scope:'local'})}catch{}
  try{for(const k of Object.keys(localStorage))if(/^sb-.*-auth-token/.test(k))localStorage.removeItem(k)}catch{}
  sessionStorage.removeItem('nas_unlocked');
}
async function token(){const{data}=await sb.auth.getSession();return data.session?.access_token}
async function findApi(){ // the PC's tunnel URL is published to url.json by start.ps1
  try{const r=await fetch('url.json?t='+Date.now());API=(await r.json()).url.replace(/\/$/,'')}catch{API=''}
}
async function api(path,o={}){
  if(!API)await findApi();

  let r;try{r=await fetch(API+path,o)}
  catch{await findApi();r=await fetch(API+path,o)} // tunnel may have restarted
  if(r.status===401&&t&&!api.dead&&path!=='/api/me'){api.dead=true;await dropLogin();location.reload()} // this device was signed out (from another device's settings)
  return r;
}
let initRetry=null;
function hostBlocked(msg){ // the app stays hidden: without the host we can't know who this is or whether the lock applies
  $('#app').hidden=true;$('#login').hidden=true;$('#offmsg').textContent=msg;$('#offscreen').hidden=false;
  let n=5;clearInterval(initRetry);$('#offretry').textContent='（'+n+' 秒後自動重試）';
  initRetry=setInterval(()=>{if(--n<=0){clearInterval(initRetry);init();return}$('#offretry').textContent='（'+n+' 秒後自動重試）'},1000);
}
$('#offgo').onclick=()=>{clearInterval(initRetry);init()};
$('#offout').onclick=async()=>{clearInterval(initRetry);await dropLogin();location.reload()};
async function init(){
  clearInterval(initRetry);$('#offscreen').hidden=true;
  $('#dev').textContent=device;
  const t=await token();
  if(!t){$('#login').hidden=false;$('#app').hidden=true;return}
  $('#login').hidden=true; // the home page stays hidden until we know whether the lock screen must come first
  let r;try{r=await api('/api/me')}catch{return hostBlocked('主機可能關機，或通道還沒啟動（開機後要執行 start.ps1）。')}
  if(!r.ok){if(r.status===401){await dropLogin();$('#app').hidden=true;$('#login').hidden=false;return} /* signed out elsewhere: show the login page (no retry loop) */return hostBlocked('主機回應了錯誤（'+r.status+'），請稍後再試。')}
  $('#off').hidden=true;me=await r.json();

// The dragged card follows the pointer (translateY), the other cards slide out of its way (FLIP animation), and on release it settles into its slot.
let drag=null;
function dragFrame(){
  const d=drag;if(!d)return;
  const c=d.card,want=d.y-d.grab; // where the card's top edge should be on screen
  const all=[...document.querySelectorAll('#list details.fold')];
  // only visible top-level folders take part (a folder inside a collapsed folder is display:none, its box is 0x0 - treating it as a neighbour made the dragged card flip back and forth); can't cross the pinned boundary: use the pin button for that
  const same=all.filter(x=>x!==c&&x.offsetParent!==null&&!x.dataset.f.includes('/')&&x.dataset.pinned===c.dataset.pinned);
  c.style.transform='';
  const center=want+c.getBoundingClientRect().height/2;
  const v0=new Map(same.map(x=>[x,x.getBoundingClientRect().top])); // where each neighbour is drawn right now
  let moved=false;
  for(const x of same){ // passing a neighbour's midpoint swaps places with it
    const r=x.getBoundingClientRect(),mid=r.top+r.height/2,after=c.compareDocumentPosition(x)&Node.DOCUMENT_POSITION_FOLLOWING;
    if(after&&center>mid){/* after the neighbour and everything inside it */(all.filter(y=>y.dataset.f.startsWith(x.dataset.f+'/')).pop()||x).after(c);moved=true}else if(!after&&center<mid){x.before(c);moved=true}
  }
  if(moved){
    d.moved=true;
    for(const x of same){ // FLIP: neighbours start where they were drawn, then glide to their new slot
      x.style.transition='none';x.style.transform='';
      const dy=v0.get(x)-x.getBoundingClientRect().top;
      if(Math.abs(dy)>1){x.style.transform=`translateY(${dy}px)`;x.getBoundingClientRect();x.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';x.style.transform=''}
      else x.style.transition='';
    }
  }
  const nat=c.getBoundingClientRect().top; // its slot in the list (transform cleared above)
  c.style.transform=`translateY(${want-nat}px) scale(1.02)`;
}

async function pickImageSrc(folder,x,fallback){

const previewHeight=()=>{const q=vq();if(q!=='orig')return +q;if(document.documentElement.classList.contains('ios'))return 1080;const long=Math.max(screen.width,screen.height)*(window.devicePixelRatio||1);return long>=3300?1440:1080};
async function pickVideoSrc(folder,x,u,seq,msg){
  if(vq()==='orig')return u; // original file, no conversion
  const h=previewHeight();let note=null,skip=false;
  try{
    for(;;){
      const r=await api('/api/vprep?folder='+encodeURIComponent(folder)+'&name='+encodeURIComponent(x.name)+'&h='+h);
      if(!r.ok)return u;
      const j=await r.json();
      if(seq!==vseq)return null;
      if(j.state==='ready'){if(note)note.remove();return API+j.url}
      if(j.state!=='processing'){if(note)note.remove();return u}
      if(!note){note=msg('<div class="big">🎞️</div>正在準備 '+h+'p 預覽版本…（第一次看這部影片需要轉檔）<br><b id="vprg">0%</b><br><button class="ghost" id="vorig" style="margin-top:10px">直接播放原檔</button>');note.querySelector('#vorig').onclick=()=>{skip=true}}

}

    '<input id="clipfile" class="fpick" type="file" accept="image/*" multiple><div id="cliplist"></div>');
  $('#clipsend').onclick=async()=>{if(await clipSendText($('#clipin').value))$('#clipin').value=''};
  $('#clippic').onclick=()=>$('#clipfile').click();
  $('#clipfile').onchange=e=>{clipSendFiles([...e.target.files]);e.target.value=''};
  $('#clipin').addEventListener('paste',e=>{
    const imgs=[...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type));
    if(imgs.length){e.preventDefault();clipSendFiles(imgs)} // pictures go straight up; plain text just lands in the box
  });
  $('#clippaste').onclick=async()=>{ // read the device clipboard (the browser asks permission the first time)
    try{
      const items=await navigator.clipboard.read();let sent=false;
      for(const it of items){
        const imgType=it.types.find(t=>/^image\/(png|jpeg|webp|gif)$/.test(t));
        if(imgType){const blob=await it.getType(imgType);sent=(await clipSendImage(new File([blob],'clip',{type:imgType})))||sent}
        else if(it.types.includes('text/plain')){const t=await (await it.getType('text/plain')).text();if(await clipSendText(t))sent=true}
      }
      if(sent){clipSig='';clipRefresh()}
    }catch{
      try{const t=await navigator.clipboard.readText();if(t)await clipSendText(t)}
      catch{alert('瀏覽器不讓網頁讀取剪貼簿。請長按上面的輸入框貼上，再按「送出文字」。')}
    }
  };
  clipSig='';clipRender();clipRefresh();
}
$('#dclip').onclick=clipOpen;
setInterval(()=>{if(me&&!document.hidden&&$('#applock').hidden&&$('#offscreen').hidden)clipRefresh()},8000);

// ---- app lock: the login stays, but opening the app (or coming back after a minute away) asks for the edit password ----
// biometric approval: the device signs a one-time challenge from the server (WebAuthn, fingerprint / face); the server verifies it, so it can stand in for the edit password
const BIO_KEY='nas_bio2',b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const bioId=()=>{try{return ls.get(BIO_KEY)||''}catch{return ''}};
let bioOK=false,bioActive=false;
async function bioCheck(){ // is this device's credential known to the server?
  const id=bioId();
  if(id&&me?.admin){bioActive=true;bioPrefetch()} // assume yes right away so the button and the challenge are ready without waiting for the server; corrected below
  try{bioOK=!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch{bioOK=false}
  let ok=false;
  if(bioOK&&id&&me?.admin){try{const r=await api('/api/bio/mine');if(r.ok)ok=(await r.json()).ids.includes(id)}catch{ok=bioActive}} // offline: keep the assumption
  bioActive=ok;syncBio();return ok;
}
let bioPre=null; // {t, v:{cid,challenge}|null}
function bioPrefetch(){
  if(!bioActive||(bioPre&&Date.now()-bioPre.t<50000))return;
  const o=bioPre={t:Date.now(),v:null};
  api('/api/bio/challenge').then(r=>r.ok?r.json():null).then(j=>{if(bioPre===o)o.v=j}).catch(()=>{});
}
let bioAbort=null;
function bioGet(){ // call directly from a tap handler; resolves to the X-Bio header value, rejects with a readable message
  if(bioAbort)try{bioAbort.abort()}catch{} // cancel a request that is still waiting, so a new tap never meets "a request is already pending"
  const ac=bioAbort=new AbortController();
  const o=bioPre;
  if(!bioActive)return Promise.reject(new Error('這台裝置還沒啟用生物辨識'));
  if(!o||!o.v||Date.now()-o.t>80000){bioPre=null;bioPrefetch();return Promise.reject(new Error('還在準備，請再按一次'))}
  bioPre=null;const {cid,challenge}=o.v;
  return navigator.credentials.get({publicKey:{challenge:unb64u(challenge),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64u(bioId())}],userVerification:'required',timeout:60000},signal:ac.signal}).then(c=>{
    const a=c.response;
    return b64u(new TextEncoder().encode(JSON.stringify({cid,id:bioId(),authData:b64u(a.authenticatorData),clientData:b64u(a.clientDataJSON),sig:b64u(a.signature)})));
  }).finally(()=>{if(bioAbort===ac)bioAbort=null;setTimeout(bioPrefetch,300)});
}
// app lock only: the device checks the fingerprint / face itself (a locally made challenge, nothing fetched first) and we just report "passed" to the server - no server-side verification
function bioLocal(){
  if(!bioId())return Promise.reject(new Error('這台裝置還沒啟用生物辨識'));
  if(bioAbort)try{bioAbort.abort()}catch{}
  const ac=bioAbort=new AbortController();
  return navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64u(bioId())}],userVerification:'required',timeout:60000},signal:ac.signal}).finally(()=>{if(bioAbort===ac)bioAbort=null});
}
const bioErr=e=>e&&e.name==='AbortError'?'':e&&e.name==='NotAllowedError'?'已取消，或這個瀏覽器不允許（請再按一次）':(e&&e.message)||'驗證失敗';
// one dialog for "prove it's you": biometric button (if enabled on this device) + edit password. act(headers) runs on success; opts.pwAction(pw) lets a caller start its own tap-bound API call.
function editDialog(msg,{okText='確認',title='🔑 確認身分',bio=true,onPw,noPw=false}={}){
  return new Promise(res=>{
    const o=document.createElement('div');o.id='editask';
    o.innerHTML='<div class="mbox card"><h3 style="margin:0 0 6px">'+esc(title)+'</h3><p class="sub" style="margin:0 0 10px">'+esc(msg||'請輸入編輯密碼')+'</p>'
      +(bio&&bioActive?'<button class="ghost" id="eabio" style="width:100%;margin-bottom:10px" disabled>🔐 準備中…</button>':'')
      +(noPw?'':'<input id="eapw" type="password" autocomplete="off" autocapitalize="off" placeholder="編輯密碼">')+'<p class="merr" id="eaerr"></p>'
      +'<div class="mbtns" style="justify-content:space-between"><button class="ghost" id="eacancel">取消</button>'+(noPw?'':'<button class="ghost" id="eaok">'+esc(okText)+'</button>')+'</div></div>';
    document.body.appendChild(o);
    const done=v=>{clearInterval(tk);o.remove();res(v)},err=t=>{$('#eaerr').textContent=t};
    let tk=null;const bb=$('#eabio');
    if(bb){bioPrefetch();tk=setInterval(()=>{bioPrefetch();const ok=!!(bioPre&&bioPre.v);bb.disabled=!ok;bb.textContent=ok?'🔐 用生物辨識確認':'🔐 準備中…'},250);
      bb.onclick=()=>{bb.disabled=true;bioGet().then(h=>done({'X-Bio':h}),e=>{err(bioErr(e));bb.disabled=false})}}
    else if(!noPw)setTimeout(()=>$('#eapw').focus(),50);
    const ok=()=>{if(noPw)return;const pw=$('#eapw').value;if(!pw)return;if(onPw){$('#eaok').disabled=true;Promise.resolve(onPw(pw)).then(v=>done(v),e=>{err(bioErr(e));$('#eaok').disabled=false})}else done({'X-Edit-Password':pw})};
    if(!noPw){$('#eaok').onclick=ok;$('#eapw').onkeydown=e=>{if(e.key==='Enter')ok()}}$('#eacancel').onclick=()=>done(null);
  });
}
const askEdit=msg=>editDialog(msg);
const askBioOnly=msg=>editDialog(msg,{title:'🔐 生物辨識確認',noPw:true}); // -> {'X-Bio':...} or null // -> headers object or null
async function bioEnable(){
  await editDialog('請輸入編輯密碼，再按「啟用」，接著用指紋／臉部確認',{okText:'啟用',title:'🔐 啟用生物辨識',bio:false,onPw:pw=>{
    // navigator.credentials.create is called right here, inside the tap (nothing awaited before it)
    return navigator.credentials.create({publicKey:{rp:{name:'我的 NAS',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:me.name,displayName:me.name},challenge:crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}}).then(async c=>{
      const key=c.response.getPublicKey&&c.response.getPublicKey(),alg=c.response.getPublicKeyAlgorithm&&c.response.getPublicKeyAlgorithm();
      if(!key||![-7,-257].includes(alg))throw new Error('這個瀏覽器不支援（無法取得公開金鑰）');
      const r=await api('/api/bio/register',{method:'POST',headers:{'X-Edit-Password':pw},body:JSON.stringify({id:b64u(c.rawId),pub:btoa(String.fromCharCode(...new Uint8Array(key))),alg})});
      if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'啟用失敗');
      ls.set(BIO_KEY,b64u(c.rawId));await bioCheck();return true;
    });
  }});
  if(bioActive)alert('已啟用：這台裝置之後可以用生物辨識解鎖，以及刪除檔案時確認身分');
}
function syncBio(){$('#devices').hidden=!bioActive;const b=$('#biobtn');if(!b)return;b.hidden=!(me?.admin&&bioOK);$('#biobtnv').textContent=bioActive?'已開啟':'未啟用'}
$('#biobtn').onclick=async()=>{
  if(!bioActive)return bioEnable();
  const eh=await askEdit('關閉這台裝置的生物辨識：請確認身分');if(!eh)return;
  const r=await api('/api/bio/remove',{method:'POST',headers:eh,body:JSON.stringify({id:bioId()})});
  if(!r.ok)return alert((await r.json().catch(()=>({}))).error||'關閉失敗');
  try{ls.set(BIO_KEY,'')}catch{}await bioCheck();
};
$('#dset').addEventListener('click',()=>bioCheck());
const needLock=()=>!!(me?.admin&&me.hasEditPassword)&&sessionStorage.getItem('nas_unlocked')!=='1';
let lockOpen=null;
function askUnlock(){
  if(lockOpen)return lockOpen;
  $('#lockpw').value='';$('#lockerr').textContent='';$('#lockgo').disabled=false;$('#applock').hidden=false;$('#lockbio').hidden=!bioId();$('#lockbio').disabled=true;if(bioId()&&me?.admin){bioActive=true;bioPrefetch()}setTimeout(()=>{if(!bioId())$('#lockpw').focus()},50);
  lockOpen=new Promise(res=>{
    let bioBusy=false;
    const bio=()=>{if(bioBusy)return;bioBusy=true;window.__unlockAt=Date.now();$('#lockerr').textContent='';$('#lockbio').disabled=true;
      bioLocal().then(()=>{
        window.__unlockAt=Date.now();sessionStorage.setItem('nas_unlocked','1');$('#applock').hidden=true;lockOpen=null;clearInterval(lt);res();
        api('/api/unlock-bio',{method:'POST'}).catch(()=>{}); // just tells the server it happened (for the activity log)
      },e=>{const m=bioErr(e);if(m)$('#lockerr').textContent=m;$('#lockbio').disabled=false}).finally(()=>{bioBusy=false});};
    $('#lockbio').onclick=bio;
    // the button appears once this device's credential is confirmed and a challenge is ready (a fresh tap is needed: Safari refuses to start it by itself)
    let lt=null;const tickBio=()=>{if($('#applock').hidden){clearInterval(lt);return}$('#lockbio').hidden=!(bioId()&&bioOK);if(!bioBusy)$('#lockbio').disabled=false};
    lt=setInterval(tickBio,150);tickBio();bioCheck();
    const go=async()=>{const pw=$('#lockpw').value;if(!pw)return;$('#lockgo').disabled=true;
      try{const r=await api('/api/unlock',{method:'POST',headers:{'X-Edit-Password':pw}});
        if(r.ok){sessionStorage.setItem('nas_unlocked','1');$('#lockgo').disabled=false;$('#applock').hidden=true;lockOpen=null;res();return}
        $('#lockerr').textContent=(await r.json().catch(()=>({}))).error||'密碼錯誤';$('#lockpw').value='';$('#lockpw').focus()}
      catch{$('#lockerr').textContent='連不到主機電腦'}
      $('#lockgo').disabled=false};
    $('#lockgo').onclick=go;$('#lockpw').onkeydown=e=>{if(e.key==='Enter')go()};
    $('#lockout').onclick=async()=>{await dropLogin();location.reload()};
  });
  return lockOpen;
}
let hiddenAt=0;
// A page that stays open in the background keeps running its old code. Look for a newer release (the version number in index.html's script link) when the app comes back to the front,
// and every 10 minutes; reload if there is one - but never in the middle of an upload, a selection, a drag or an open window.
async function checkNewVersion(){
  try{
    const cur=(document.querySelector('script[src^="glass.js"]')?.getAttribute('src').match(/v=([\w]+)/)||[])[1];if(!cur)return;
    const t=await (await fetch('index.html?_='+Date.now(),{cache:'no-store'})).text(),m=t.match(/glass\.js\?v=([\w]+)/);
    if(m&&m[1]!==cur&&!allJobs.size&&!selMode&&!drag&&$('#modal').hidden&&!vOpen&&!document.querySelector('#editask'))location.reload();
  }catch{}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkNewVersion,800)});
setInterval(()=>{if(!document.hidden)checkNewVersion()},600e3);
setTimeout(checkNewVersion,4000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){keepAwake();for(const j of allJobs)if(j.failed){j.failed=false;j.tries=0;j.d.querySelector('.rt').hidden=true;queue.push(j);pump()}} // resume uploads that stalled in the background
  const justUnlocking=!$('#applock').hidden||Date.now()-(window.__unlockAt||0)<8000;   // the Face ID / fingerprint sheet makes the page hide and show again: that must not count as leaving the app
  if(document.hidden){if(justUnlocking)return;hiddenAt=Date.now();if(needLock()===false&&me?.admin&&me.hasEditPassword)document.body.classList.add('covered');return}
  if(justUnlocking){hiddenAt=0;document.body.classList.remove('covered');return}
  if(hiddenAt&&Date.now()-hiddenAt>lockMs()&&me?.admin&&me.hasEditPassword){sessionStorage.removeItem('nas_unlocked');askUnlock()}
  document.body.classList.remove('covered');hiddenAt=0;
});
// ---- install as an app (same idea as the ledger app) ----
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const syncInstall=()=>{$('#install').hidden=isStandalone()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;syncInstall()});
addEventListener('appinstalled',()=>{deferredInstall=null;syncInstall()});
$('#install').onclick=()=>{
  if(deferredInstall){deferredInstall.prompt();deferredInstall=null}
  else{const ua=navigator.userAgent,mac=/Macintosh/.test(navigator.platform+ua)&&!(navigator.maxTouchPoints>1),chrome=/Chrome|Edg|CriOS/.test(ua);
    alert(/iPhone|iPad/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'iPhone / iPad：點 Safari 下方的「分享」→「加入主畫面」'
      :mac&&!chrome?'Mac（Safari）：選單列「檔案」→「加入 Dock」（需 macOS Sonoma 14 以上）'
      :mac?'Mac（Chrome / Edge）：網址列右邊的「安裝」圖示，或選單裡的「安裝 NAS」'
      :'請用瀏覽器選單裡的「安裝應用程式」或「加入主畫面」')}
};
syncInstall();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

setInterval(()=>{if(me&&!document.hidden&&!vOpen&&$('#applock').hidden)refresh()},10000);
init();
