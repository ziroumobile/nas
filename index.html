<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src 'self' https://eehcyvnyjzhmeuueqjvk.supabase.co https://*.trycloudflare.com; img-src https://*.trycloudflare.com data:; media-src https://*.trycloudflare.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>我的 NAS</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c1e21;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#e8eaed;--mut:#9aa0a6;--ac:#60a5fa;--bd:#2a2e37}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,"Noto Sans TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.del{background:transparent;color:#dc2626;border:1px solid var(--bd);padding:4px 10px}
input[type=email],input[type=password]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}
select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;max-width:60vw}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
#login{max-width:340px;margin:12vh auto}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut);margin-bottom:12px;cursor:pointer}
#drop.over{border-color:var(--ac);color:var(--ac)}
details.fold{margin-bottom:12px}
details.fold>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;list-style:none;padding:2px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--mut)}
details.fold[open]>summary::before{content:"▾"}
.fname{flex:1;min-width:0;word-break:break-all}.cnt{color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.ico{width:44px;height:44px;border-radius:8px;background:var(--bg);object-fit:cover;flex:none;display:grid;place-items:center;font-size:20px}
.info{flex:1;min-width:0}.info a{color:var(--fg);text-decoration:none;font-weight:500;word-break:break-all}
.info small{display:block;color:var(--mut)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin:4px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);width:0}
#err{color:#dc2626;margin:0 0 8px;min-height:1em}
#off{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px;margin-bottom:12px}
.empty{color:var(--mut);padding:10px 0;border-top:1px solid var(--bd)}
button.on{background:var(--ac);color:#fff}
.selecting .tile,.selecting .row{cursor:pointer}
.chk{display:none;flex:none;width:22px;height:22px;border:2px solid var(--mut);border-radius:6px;place-items:center;font-size:14px;line-height:1;color:#fff;background:var(--card)}
.selecting .chk{display:grid}
.tile{position:relative}.tile .chk{position:absolute;top:6px;left:6px;z-index:2}
.sel>.chk,.sel .chk{background:var(--ac);border-color:var(--ac)}
.sel>.chk::after,.sel .chk::after{content:"✓"}
.tile.sel{outline:3px solid var(--ac)}.row.sel{background:rgba(37,99,235,.12)}
#selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
#selbar[hidden]{display:none}
body.selecting .wrap{padding-bottom:90px}
button.danger{background:#dc2626}
#player{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:30;display:flex;align-items:center;justify-content:center}
#player[hidden]{display:none}
.pbox{width:min(1100px,100%);padding:10px}
.ptop{display:flex;gap:8px;align-items:center;margin-bottom:8px;color:#fff}
#ptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop .btn{text-decoration:none;padding:6px 12px}
#pv{width:100%;max-height:82vh;background:#000;border-radius:8px}
#perr{color:#fbbf24;margin:10px 2px 0}
.seg{display:inline-flex}.seg button{border-radius:0;border-left-width:0}.seg button:first-child{border-radius:8px 0 0 8px;border-left-width:1px}.seg button:last-child{border-radius:0 8px 8px 0}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:8px;border-top:1px solid var(--bd)}
@media(min-width:700px){.nine{grid-template-columns:repeat(5,1fr)}} /* phone: 3 per row, computer: 5 per row */
.cell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:4px;background:var(--bd)}
.cell .thumbA{position:absolute;inset:0}
.cell .thumbA img,.cell .ico{width:100%;height:100%;border-radius:0;object-fit:cover;font-size:30px}
.cell .cn{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 3px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cell .chk{position:absolute;top:4px;left:4px;z-index:2}
.cell.sel{outline:3px solid var(--ac);outline-offset:-3px}
.selecting .cell{cursor:pointer}
.thumbA{position:relative;display:block;flex:none}
.play{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-size:10px;padding:1px 4px;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-top:8px;border-top:1px solid var(--bd)}
.tile{background:var(--bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.tile .thumbA{aspect-ratio:16/10;background:var(--bd)}
.tile .thumbA img,.tile .thumbA .ico{width:100%;height:100%;border-radius:0;object-fit:cover;font-size:34px}
.tile .tn{padding:6px 8px 0;font-weight:500;font-size:13px;line-height:1.3;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{padding:0 8px;color:var(--mut);font-size:12px}
.tile .ta{display:flex;gap:6px;padding:6px 8px 8px;margin-top:auto}
.tile .ta .btn,.tile .ta button{padding:3px 9px;font-size:12px;text-decoration:none}
</style></head><body><div class="wrap">
<div id="login" class="card" hidden>
  <h1 style="margin-bottom:14px">登入 NAS</h1>
  <p id="err"></p>
  <input id="u" type="email" placeholder="Email" autocomplete="username">
  <input id="p" type="password" placeholder="密碼" autocomplete="current-password">
  <button id="go" style="width:100%">登入</button>
</div>
<div id="app" hidden>
  <header><h1>📁 我的 NAS</h1><div><span id="who" style="color:var(--mut);margin-right:8px"></span><button class="ghost" id="out">登出</button></div></header>
  <div id="off" hidden>⚠️ 連不到主機電腦（可能關機或通道未啟動）</div>
  <div class="bar">
    <span>此裝置：<b id="dev"></b></span><button class="ghost" id="rename">改名</button>
    <button class="ghost" id="newf">＋ 新增資料夾</button>
    <button class="ghost" id="setpw" hidden>🔑 編輯密碼</button>
  </div>
  <div class="bar">上傳到：<select id="target"></select></div>
  <div class="bar">
    <span class="seg"><button class="ghost" id="vlist">☰ 列表</button><button class="ghost" id="vgrid">▦ 大圖示</button><button class="ghost" id="vnine">▩ 中圖示</button></span>
    排序：<select id="sort"><option value="name">名稱</option><option value="date">更新日期</option><option value="size">大小</option></select>
    <button class="ghost" id="order"></button>
    <button class="ghost" id="selmode">☑ 選取</button>
  </div>
  <div id="drop">點擊選擇檔案，或把檔案拖到這裡上傳<input id="f" type="file" multiple hidden></div>
  <div id="ups"></div>
  <div id="list"></div>
</div>
<div id="player" hidden>
  <div class="pbox">
    <div class="ptop"><span id="ptitle"></span><a id="pdl" class="btn">下載</a><button class="ghost" id="pclose">✕ 關閉</button></div>
    <video id="pv" controls playsinline preload="metadata"></video>
    <p id="perr" hidden>這個瀏覽器無法播放此影片格式（例如 iPhone 的 HEVC .mov），請按「下載」後用播放器開啟。</p>
  </div>
</div>
<div id="selbar" hidden>
  <b id="selcount">已選 0 個</b>
  <button class="ghost" id="selall">全選</button>
  <button class="ghost" id="selnone">清除選取</button>
  <button id="seldl">下載選取</button>
  <button class="danger" id="seldel" hidden>刪除選取</button>
  <button class="ghost" id="selexit">完成</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);let me=null,API='',folders=[];
const sb=supabase.createClient(NAS_CONFIG.supabaseUrl,NAS_CONFIG.supabaseAnonKey);
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
// device name: user-editable, remembered per browser
function guessDevice(){const u=navigator.userAgent;
  return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows 電腦':/Mac/.test(u)?'Mac':'未命名裝置'}
let device=ls.get('nas_device')||guessDevice();
const closed=new Set(JSON.parse(ls.get('nas_closed')||'[]'));
async function token(){const{data}=await sb.auth.getSession();return data.session?.access_token}
async function findApi(){ // the PC's tunnel URL is published to url.json by start.ps1
  try{const r=await fetch('url.json?t='+Date.now());API=(await r.json()).url.replace(/\/$/,'')}catch{API=''}
}
async function api(path,o={}){
  if(!API)await findApi();
  const t=await token();
  o.headers=Object.assign({Authorization:'Bearer '+t},o.headers||{});
  try{return await fetch(API+path,o)}
  catch{await findApi();return fetch(API+path,o)} // tunnel may have restarted
}
async function init(){
  $('#dev').textContent=device;
  const t=await token();
  if(!t){$('#login').hidden=false;$('#app').hidden=true;return}
  $('#login').hidden=true;$('#app').hidden=false;
  let r;try{r=await api('/api/me')}catch{$('#off').hidden=false;return}
  if(!r.ok){$('#off').hidden=r.status===401;if(r.status===401){await sb.auth.signOut();return init()}return}
  $('#off').hidden=true;me=await r.json();$('#who').textContent=me.name+(me.admin?'（管理員）':'');
  $('#setpw').hidden=!me.admin;refresh();
}
$('#go').onclick=async()=>{
  const{error}=await sb.auth.signInWithPassword({email:$('#u').value.trim(),password:$('#p').value});
  if(error)$('#err').textContent='帳號或密碼錯誤';else{$('#err').textContent='';init()}
};
$('#p').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#rename').onclick=()=>{const n=prompt('這台裝置的名稱（上傳預設會存到同名資料夾）',device);
  if(n&&n.trim()){device=n.trim();ls.set('nas_device',device);$('#dev').textContent=device;target=device;drawTarget()}};
let target=device;
function drawTarget(){
  const names=[...new Set([device,...folders.map(f=>f.name)])];
  if(!names.includes(target))target=device;
  $('#target').innerHTML=names.map(n=>`<option value="${esc(n)}"${n===target?' selected':''}>${esc(n)}${n===device?'（此裝置）':''}</option>`).join('');
}
$('#target').onchange=e=>target=e.target.value;
// view mode and sorting, remembered per browser
let view=['list','grid','nine'].includes(ls.get('nas_view'))?ls.get('nas_view'):'grid',sortBy=['name','date','size'].includes(ls.get('nas_sort'))?ls.get('nas_sort'):'date',asc=ls.get('nas_asc')==='1',lastSig='';
const cmpName=(a,b)=>a.name.localeCompare(b.name,'zh-Hant',{numeric:true});
const CMP={name:cmpName,date:(a,b)=>a.mtime-b.mtime,size:(a,b)=>a.size-b.size};
const dir=n=>(asc?1:-1)*n;
const sortFiles=fs=>[...fs].sort((a,b)=>dir(CMP[sortBy](a,b))||cmpName(a,b));
function sortFolders(){ // folders follow the same rule: by name, by newest file, or by total size
  const key=f=>sortBy==='date'?Math.max(0,...f.files.map(x=>x.mtime)):f.files.reduce((s,x)=>s+x.size,0);
  return [...folders].sort((a,b)=>sortBy==='name'?dir(cmpName(a,b)):dir(key(a)-key(b))||cmpName(a,b));
}
function syncToolbar(){
  $('#vlist').classList.toggle('on',view==='list');$('#vgrid').classList.toggle('on',view==='grid');$('#vnine').classList.toggle('on',view==='nine');
  $('#sort').value=sortBy;$('#order').textContent=asc?'↑ 由小到大':'↓ 由大到小';
}
const setPref=()=>{ls.set('nas_view',view);ls.set('nas_sort',sortBy);ls.set('nas_asc',asc?'1':'0');syncToolbar();render(true)};
$('#vlist').onclick=()=>{view='list';setPref()};$('#vgrid').onclick=()=>{view='grid';setPref()};$('#vnine').onclick=()=>{view='nine';setPref()};
$('#sort').onchange=e=>{sortBy=e.target.value;asc=sortBy==='name';setPref()}; // names read A→Z, dates/sizes newest/biggest first
$('#order').onclick=()=>{asc=!asc;setPref()};
const ICON={image:'🖼',video:'🎬',file:'📄'};
function thumbErr(img){const d=document.createElement('div');d.className='ico';d.textContent=img.dataset.k==='video'?'🎬':'🖼';img.replaceWith(d)}
function media(x,k){
  const inner=x.thumb?`<img class="ico" loading="lazy" decoding="async" data-k="${x.kind}" src="${API+x.thumb}" alt="" onerror="thumbErr(this)">`:`<div class="ico">${ICON[x.kind]}</div>`;
  return `<a class="thumbA" href="${API+x.url}" target="_blank" rel="noopener"${x.kind==='video'?` data-vid="${esc(k)}"`:''}>${inner}${x.kind==='video'?'<span class="play">▶</span>':''}</a>`;
}
// selection: pick many files to download, or (admin only) delete
let selMode=false;const selected=new Set();const keyOf=(f,n)=>f+'/'+n;
const splitKey=k=>{const i=k.indexOf('/');return{folder:k.slice(0,i),name:k.slice(i+1)}};
function allKeys(){return folders.flatMap(f=>f.files.map(x=>keyOf(f.name,x.name)))}
function fileByKey(k){const{folder,name}=splitKey(k);return folders.find(f=>f.name===folder)?.files.find(x=>x.name===name)}
function updateSelUI(){
  document.body.classList.toggle('selecting',selMode);
  $('#selbar').hidden=!selMode;$('#selmode').classList.toggle('on',selMode);
  $('#selcount').textContent='已選 '+selected.size+' 個';
  $('#seldel').hidden=!me?.admin;$('#seldel').disabled=$('#seldl').disabled=$('#selnone').disabled=!selected.size;
}
function fileItem(f,x){
  const u=API+x.url,k=keyOf(f.name,x.name),sel=selected.has(k)?' sel':'';
  const del=me.admin?`<button class="del" data-f="${esc(f.name)}" data-n="${esc(x.name)}">刪除</button>`:'';
  const meta=`${fmt(x.size)} · 更新 ${new Date(x.mtime).toLocaleDateString()} ${new Date(x.mtime).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  if(view==='nine')return `<div class="cell${sel}" data-k="${esc(k)}" title="${esc(x.name)}"><span class="chk"></span>${media(x,k)}<div class="cn">${esc(x.name)}</div></div>`;
  if(view==='grid')return `<div class="tile${sel}" data-k="${esc(k)}"><span class="chk"></span>${media(x,k)}<div class="tn" title="${esc(x.name)}">${esc(x.name)}</div><small>${meta}</small><small>${esc(x.owner)}</small>
    <div class="ta"><a class="btn" href="${u}&dl=1">下載</a>${del}</div></div>`;
  return `<div class="row${sel}" data-k="${esc(k)}"><span class="chk"></span>${media(x,k)}
    <div class="info"><a href="${u}" target="_blank" rel="noopener"${x.kind==='video'?` data-vid="${esc(k)}"`:''}>${esc(x.name)}</a><small>${meta} · ${esc(x.owner)}</small></div>
    <a class="btn" href="${u}&dl=1" style="padding:4px 10px;text-decoration:none">下載</a>${del}</div>`;
}
function render(force){
  const sig=JSON.stringify([folders,view,sortBy,asc,API,selMode,!!me?.admin]);
  if(!force&&sig===lastSig)return; // nothing changed: leave the DOM (and loaded thumbnails) alone
  lastSig=sig;
  $('#list').innerHTML=folders.length?sortFolders().map(f=>{
    const items=sortFiles(f.files).map(x=>fileItem(f,x)).join('');
    const body=!f.files.length?'<div class="empty">（空資料夾）</div>':view==='grid'?`<div class="grid">${items}</div>`:view==='nine'?`<div class="nine">${items}</div>`:items;
    const tools=(selMode&&f.files.length?`<button class="ghost" data-selfolder="${esc(f.name)}" style="padding:4px 10px">全選</button>`:'')
      +(me.admin?`<button class="del" data-delfolder="${esc(f.name)}">刪除資料夾</button>`:'');
    return `<details class="fold card" data-f="${esc(f.name)}"${closed.has(f.name)?'':' open'}><summary><span class="fname">📂 ${esc(f.name)} <span class="cnt">${f.files.length} 個檔案</span></span>
      ${tools}</summary>${body}</details>`}).join(''):'<div class="card" style="color:var(--mut);text-align:center">還沒有資料夾，上傳檔案會自動建立「'+esc(device)+'」</div>';
  updateSelUI();
}
async function refresh(){
  let r;try{r=await api('/api/files')}catch{$('#off').hidden=false;return}
  if(!r.ok)return;$('#off').hidden=true;
  folders=await r.json();drawTarget();
  const have=new Set(allKeys());for(const k of selected)if(!have.has(k))selected.delete(k); // files that vanished
  render(false);updateSelUI();
}
syncToolbar();
function setSel(k,on){on?selected.add(k):selected.delete(k);
  for(const el of document.querySelectorAll('[data-k]'))if(el.dataset.k===k)el.classList.toggle('sel',on)}
$('#selmode').onclick=()=>{selMode=!selMode;if(!selMode)selected.clear();render(true)};
$('#selexit').onclick=()=>{selMode=false;selected.clear();render(true)};
$('#selall').onclick=()=>{allKeys().forEach(k=>setSel(k,true));updateSelUI()};
$('#selnone').onclick=()=>{[...selected].forEach(k=>setSel(k,false));updateSelUI()};
function selectFolder(name){folders.find(f=>f.name===name)?.files.forEach(x=>setSel(keyOf(name,x.name),true));updateSelUI()}
$('#seldl').onclick=async()=>{ // browsers may ask to allow multiple downloads the first time
  for(const k of [...selected]){const x=fileByKey(k);if(!x)continue;
    const a=document.createElement('a');a.href=API+x.url+'&dl=1';document.body.appendChild(a);a.click();a.remove();
    await new Promise(r=>setTimeout(r,700))}
};
$('#seldel').onclick=()=>deleteItems([...selected].map(splitKey),`確定要刪除選取的 ${selected.size} 個檔案嗎？此動作無法復原。`);
async function deleteItems(items,msg){ // admin only; the server checks too. One edit-password prompt covers the whole batch.
  if(!me.admin||!items.length||!confirm(msg))return;
  const pw=prompt('請輸入編輯密碼');if(pw===null)return;
  const r=await api('/api/delete-files',{method:'POST',headers:{'X-Edit-Password':pw},body:JSON.stringify({items})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)return alert(j.error||'刪除失敗');
  items.forEach(i=>selected.delete(keyOf(i.folder,i.name)));
  await refresh();render(true);
}
$('#list').addEventListener('toggle',e=>{const f=e.target.dataset?.f;if(!f||!e.target.matches('details.fold'))return;
  e.target.open?closed.delete(f):closed.add(f);ls.set('nas_closed',JSON.stringify([...closed]))},true);
$('#list').onclick=async e=>{
  const b=e.target.closest('button');
  if(b){
    if(b.dataset.selfolder){e.preventDefault();return selectFolder(b.dataset.selfolder)}
    if(b.dataset.delfolder){e.preventDefault();return delFolder(b.dataset.delfolder)}
    if(b.dataset.n)return deleteItems([{folder:b.dataset.f,name:b.dataset.n}],`確定要刪除「${b.dataset.n}」嗎？`);
    return;
  }
  if(selMode&&!e.target.closest('a.btn')){ // in select mode a tap toggles the item instead of opening it
    const it=e.target.closest('[data-k]');
    if(it){e.preventDefault();setSel(it.dataset.k,!selected.has(it.dataset.k));updateSelUI()}
    return;
  }
  const v=e.target.closest('a[data-vid]');
  if(v){e.preventDefault();playVideo(v.dataset.vid)} // videos play in the page; the download button still downloads
};
function playVideo(k){
  const x=fileByKey(k);if(!x)return;
  const v=$('#pv');
  $('#ptitle').textContent=x.name;$('#pdl').href=API+x.url+'&dl=1';$('#perr').hidden=true;
  v.poster=x.thumb?API+x.thumb:'';v.src=API+x.url;$('#player').hidden=false;
  v.play().catch(()=>{}); // autoplay may be refused; the controls are there
}
function closePlayer(){const v=$('#pv');v.pause();v.removeAttribute('src');v.load();$('#player').hidden=true}
$('#pv').addEventListener('error',()=>{if($('#pv').getAttribute('src'))$('#perr').hidden=false});
$('#pclose').onclick=closePlayer;
$('#player').onclick=e=>{if(e.target.id==='player')closePlayer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#player').hidden)closePlayer()});
async function delFolder(name){
  if(!me.admin)return;
  if(!confirm(`確定要刪除資料夾「${name}」以及裡面所有檔案嗎？此動作無法復原。`))return;
  const pw=prompt('請輸入編輯密碼');if(pw===null)return;
  const r=await api('/api/folder?name='+encodeURIComponent(name),{method:'DELETE',headers:{'X-Edit-Password':pw}});
  if(!r.ok)alert((await r.json()).error);refresh();
}
$('#newf').onclick=async()=>{
  const n=prompt('新資料夾名稱');if(!n||!n.trim())return;
  const r=await api('/api/folder?name='+encodeURIComponent(n.trim()),{method:'POST'});
  if(!r.ok)alert((await r.json()).error);else{target=(await r.json()).name;refresh()}
};
$('#setpw').onclick=async()=>{
  let cur='';
  if(me.hasEditPassword){cur=prompt('請輸入目前的編輯密碼');if(cur===null)return}
  const nw=prompt('設定新的編輯密碼（至少 4 個字元）');if(nw===null)return;
  const r=await api('/api/edit-password',{method:'PUT',body:JSON.stringify({current:cur,new:nw})});
  if(r.ok){me.hasEditPassword=true;alert('編輯密碼已更新')}else alert((await r.json()).error);
};
// Uploads run through a queue (2 at a time) with automatic retry; failures show a reason + retry button.
const queue=[];let running=0;const MAX_PAR=2,MAX_TRY=3;
function enqueue(file,folder){
  const d=document.createElement('div');d.className='card';d.style.marginBottom='8px';
  d.innerHTML=`<div>${esc(file.name)} → ${esc(folder)} <small class="s">等待中</small> <button class="ghost rt" hidden style="padding:2px 8px">重試</button></div><div class="prog"><i></i></div>`;
  $('#ups').prepend(d);
  const job={file,folder,d,tries:0};
  d.querySelector('.rt').onclick=()=>{d.querySelector('.rt').hidden=true;job.tries=0;queue.push(job);pump()};
  queue.push(job);pump();
}
function pump(){while(running<MAX_PAR&&queue.length){running++;runJob(queue.shift()).finally(()=>{running--;pump()})}}
// Files go up in 48MB pieces (stays under Cloudflare's per-request size cap); a dropped connection resumes from the last byte the PC has.
const CHUNK=48*1024*1024;
const newId=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function sendChunk(j,offset,onprog){
  if(!API)await findApi();const t=await token();
  return new Promise(res=>{
    const x=new XMLHttpRequest();
    x.open('PUT',`${API}/api/upload-chunk?folder=${encodeURIComponent(j.folder)}&name=${encodeURIComponent(j.file.name)}&id=${j.id}&offset=${offset}&total=${j.file.size}&mtime=${j.file.lastModified||0}`);
    x.setRequestHeader('Authorization','Bearer '+t);
    x.upload.onprogress=e=>onprog(e.loaded);
    x.onload=()=>{let b={};try{b=JSON.parse(x.responseText)}catch{}res({status:x.status,body:b})};
    x.onerror=()=>res({status:0});x.ontimeout=()=>res({status:0});
    x.send(j.file.slice(offset,Math.min(offset+CHUNK,j.file.size)));
  });
}
async function runJob(j){
  const s=j.d.querySelector('.s'),bar=j.d.querySelector('i'),total=j.file.size;
  j.id=j.id||newId();j.offset=j.offset||0;
  const show=(done,note)=>{const p=total?Math.min(100,done/total*100):100;bar.style.width=p+'%';s.textContent=Math.round(p)+'%'+(note||'')};
  let fails=0;
  if(j.offset>0){const r=await api(`/api/upload-status?folder=${encodeURIComponent(j.folder)}&id=${j.id}`).catch(()=>null);if(r?.ok)j.offset=(await r.json()).received}
  while(true){
    show(j.offset,fails?`（重試 ${fails}/${MAX_TRY}）`:'');
    const r=await sendChunk(j,j.offset,l=>show(j.offset+l,fails?`（重試 ${fails}/${MAX_TRY}）`:''));
    if(r.status===200&&(r.body.done||Number.isFinite(r.body.received))){
      fails=0;
      if(r.body.done){j.d.remove();refresh();return}
      j.offset=r.body.received;continue;
    }
    if(r.status===409){j.offset=r.body.received;continue} // server has a different amount; resync
    if(r.status===401){s.textContent='失敗：登入過期，請重新整理頁面';break}
    const why=r.status?`伺服器回應 ${r.status}`+(r.body?.error?`（${r.body.error}）`:''):'網路中斷或連不到主機';
    if(++fails>MAX_TRY){s.textContent='失敗：'+why;break}
    s.textContent=`${why}，重試中 ${fails}/${MAX_TRY}`;
    await new Promise(r=>setTimeout(r,2000*fails));await findApi(); // tunnel may have restarted
    const st=await api(`/api/upload-status?folder=${encodeURIComponent(j.folder)}&id=${j.id}`).catch(()=>null);
    if(st?.ok)j.offset=(await st.json()).received; // resume from what the PC actually has
  }
  j.d.querySelector('.rt').hidden=false;
}
const pick=fl=>{const f=target;[...fl].forEach(x=>enqueue(x,f))};
$('#drop').onclick=()=>$('#f').click();$('#f').onchange=e=>{pick(e.target.files);e.target.value=''};
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};
$('#drop').ondragleave=()=>$('#drop').classList.remove('over');
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('over');pick(e.dataTransfer.files)};
setInterval(()=>{if(me&&!document.hidden)refresh()},10000);
init();
