<title>我的 NAS</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c1e21;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#e8eaed;--mut:#9aa0a6;--ac:#60a5fa;--bd:#2a2e37}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,"Noto Sans TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.del{background:transparent;color:#dc2626;border:1px solid var(--bd);padding:4px 10px}
button.danger{background:#dc2626}
button.on{background:var(--ac);color:#fff}
input[type=email],input[type=password]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}
select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;max-width:60vw}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
#login{max-width:340px;margin:12vh auto}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut);margin-bottom:12px;cursor:pointer}
#drop.over{border-color:var(--ac);color:var(--ac)}
details.fold{margin-bottom:12px}
details.fold>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;list-style:none;padding:2px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--mut)}
details.fold[open]>summary::before{content:"▾"}
details.fold>summary{position:relative}
details.fold.hasgrip>summary{padding-right:50px} /* room for the drag handle on the right */
/* drag handle: three lines (drawn with gradients), at the right edge, centred vertically on the folder's header */
.grip{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:48px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:10px;
  background:linear-gradient(var(--mut),var(--mut)) center 15px/22px 3px no-repeat,linear-gradient(var(--mut),var(--mut)) center 22px/22px 3px no-repeat,linear-gradient(var(--mut),var(--mut)) center 29px/22px 3px no-repeat}
.grip:active,details.fold.dragging .grip{background-color:rgba(127,127,127,.18)}
body.dragmode{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.dragmode details.fold>*:not(summary){display:none}
details.fold.dragging{position:relative;z-index:20;transition:none!important;outline:2px solid var(--ac);box-shadow:0 18px 40px rgba(0,0,0,.4);will-change:transform}
details.fold.pinned{border-color:var(--ac)}
details.fold>summary{flex-wrap:wrap;row-gap:8px}
.fname{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.ftools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ftools:empty{display:none}
@media(max-width:640px){.ftools{flex-basis:100%}} /* phones: the buttons drop to their own row under the folder name */.cnt{color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.ico{width:44px;height:44px;border-radius:8px;background:var(--bg);object-fit:cover;flex:none;display:grid;place-items:center;font-size:20px}
.row{flex-wrap:wrap}
.info{flex:1 1 120px;min-width:0}.info a{color:var(--fg);text-decoration:none;font-weight:500;word-break:break-all}
.rbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:480px){.rbtns{flex-basis:100%;padding-left:54px}} /* narrow phones: the buttons go under the file name instead of squeezing it */
.info small{display:block;color:var(--mut)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin:4px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);width:0}
#err{color:#dc2626;margin:0 0 8px;min-height:1em}
#off{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px;margin-bottom:12px}
.empty{color:var(--mut);padding:10px 0;border-top:1px solid var(--bd)}
.seg{display:inline-flex}.seg button{border-radius:0;border-left-width:0}.seg button:first-child{border-radius:8px 0 0 8px;border-left-width:1px}.seg button:last-child{border-radius:0 8px 8px 0}
/* icon views: medium = 3 per row on phone / 5 on computer; small = 5 per row on phone / 8 on computer */
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:8px;border-top:1px solid var(--bd)}
.nine.small{grid-template-columns:repeat(5,1fr);gap:2px}
@media(min-width:700px){.nine{grid-template-columns:repeat(5,1fr)}.nine.small{grid-template-columns:repeat(8,1fr)}}
.cell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:4px;background:var(--bd)}
.cell .thumbA{position:absolute;inset:0}
.cell .thumbA img,.cell .ico{width:100%;height:100%;border-radius:0;object-fit:cover;font-size:30px}
.small .cell .ico{font-size:20px}
.cell .cn{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 3px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.small .cell .cn{display:none}
.cell .chk{position:absolute;top:4px;left:4px;z-index:2}
.small .cell .chk{width:16px;height:16px;font-size:11px;border-width:1.5px;top:2px;left:2px}
.cell.sel{outline:3px solid var(--ac);outline-offset:-3px}
.thumbA{position:relative;display:block;flex:none}
.play{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-size:10px;padding:1px 4px;pointer-events:none}
.small .play{font-size:8px;padding:0 3px}
/* selection */
.selecting .cell,.selecting .row{cursor:pointer}
.chk{display:none;flex:none;width:22px;height:22px;border:2px solid var(--mut);border-radius:6px;place-items:center;font-size:14px;line-height:1;color:#fff;background:var(--card)}
.selecting .chk{display:grid}
.sel>.chk{background:var(--ac);border-color:var(--ac)}.sel>.chk::after{content:"✓"}
.row.sel{background:rgba(37,99,235,.12)}
#selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
#selbar[hidden]{display:none}
body.selecting .wrap{padding-bottom:100px}
/* in-page preview */
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
.vtop{display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));color:#fff}
.vtop{flex-wrap:wrap}
#vtitle{flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.vbtns{flex-basis:100%;justify-content:flex-end}} /* phones: the file name keeps the whole first row, the buttons get their own row */
#vpos{color:#9ca3af;font-size:13px;white-space:nowrap}
.vtop .btn{text-decoration:none;padding:6px 12px}
#vinfop{position:absolute;top:var(--vbar,56px);right:10px;width:min(360px,calc(100% - 20px));max-height:calc(100% - var(--vbar,56px) - 24px);overflow:auto;background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:12px;padding:12px 14px;z-index:52;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:14px}
#vinfop[hidden]{display:none}
#vinfop h4{margin:0 0 8px;font-size:15px}
#vinfop .ir{display:flex;gap:10px;padding:5px 0;border-top:1px solid #374151}
#vinfop .ir:first-of-type{border-top:0}
#vinfop .ik{flex:none;width:76px;color:#9ca3af}
#vinfop .iv{flex:1;min-width:0;word-break:break-all}
#vstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom));position:relative}
#vstage img.vimg{max-width:100%;max-height:100%;object-fit:contain}
#vstage video{max-width:100%;max-height:100%;background:#000;border-radius:6px}
#vstage audio{width:min(600px,100%)}
#vstage iframe{width:100%;height:100%;border:0;background:#fff;border-radius:6px}
#vstage pre{width:100%;height:100%;margin:0;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#e5e7eb;background:#111827;border-radius:6px;text-align:left;font:13px/1.5 ui-monospace,Consolas,monospace}
.vmsg{color:#d1d5db;text-align:center;padding:20px;line-height:1.7}.vmsg .big{font-size:56px}.vmsg.warn{color:#fbbf24}
.vnav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:28px;padding:0;z-index:51}
#vprev{left:6px}#vnext{right:6px}
/* dialogs (sharing) */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#modal[hidden]{display:none}
#modal.top{z-index:60}
.mbox{width:min(460px,100%);max-height:100%;overflow:auto}
.mbox h3{margin:0 0 8px;font-size:17px}.mbox .sub{color:var(--mut);font-size:13px;margin:0 0 12px;line-height:1.5}
.mbox label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.mbox input[type=password],.mbox input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:4px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.merr{color:#dc2626;min-height:1.2em;margin:6px 0 0}
.mwarn{background:#fef3c7;color:#92400e;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px;line-height:1.5}
.srow{border-top:1px solid var(--bd);padding:10px 0}.srow:first-of-type{border-top:0}
.sth{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.sc{position:relative;display:block;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--bd);flex:none}
.sc img,.sc .ico{width:100%;height:100%;object-fit:cover;border-radius:0;font-size:22px}
.srow b{word-break:break-all}.srow small{display:block;color:var(--mut);margin:2px 0 6px}
</style></head><body><div class="wrap">
<div id="login" class="card" hidden>
  <h1 style="margin-bottom:14px">登入 NAS</h1>
  <p id="err"></p>
  <input id="u" type="email" placeholder="Email" autocomplete="username">
  <input id="p" type="password" placeholder="密碼" autocomplete="current-password">
  <button id="go" style="width:100%">登入</button>
</div>
<div id="app" hidden>
  <header><h1>📁 我的 NAS</h1><div><span id="who" style="color:var(--mut);margin-right:8px"></span><button class="ghost" id="shares" hidden style="margin-right:6px">🔗 已分享連結</button><button class="ghost" id="out">登出</button></div></header>
  <div id="off" hidden>⚠️ 連不到主機電腦（可能關機或通道未啟動）</div>
  <div class="bar">
    <span>此裝置：<b id="dev"></b></span><button class="ghost" id="rename">改名</button>
    <button class="ghost" id="newf">＋ 新增資料夾</button>
    <button class="ghost" id="setpw" hidden>🔑 編輯密碼</button>
    <button class="ghost" id="install" hidden>📲 安裝成 App</button>
  </div>
  <div class="bar">上傳到：<select id="target"></select></div>
  <div class="bar">
    <span class="seg"><button class="ghost" id="vlist">☰ 列表</button><button class="ghost" id="vnine">▩ 中圖示</button><button class="ghost" id="vsmall">▪ 小圖示</button></span>
    排序：<select id="sort"><option value="name">名稱</option><option value="date">更新日期</option><option value="size">大小</option></select>
    <button class="ghost" id="order"></button>
    <button class="ghost" id="selmode">☑ 選取</button>
    <button class="ghost" id="resetorder" hidden title="清除你拖動調整過的資料夾順序">↺ 恢復自動排序</button>
  </div>
  <div id="drop">點擊選擇檔案，或把檔案拖到這裡上傳<input id="f" type="file" multiple hidden></div>
  <div id="ups"></div>
  <div id="total" style="color:var(--mut);font-size:13px;margin:0 2px 8px"></div>
  <div id="list"></div>
</div>
<div id="viewer" hidden>
  <div class="vtop"><span id="vtitle"></span><span id="vpos"></span><div class="vbtns"><button class="ghost" id="vshare" hidden style="color:#fff">🔗 分享</button><button class="ghost" id="vdel" hidden style="color:#f87171">🗑 刪除</button><button class="ghost" id="vinfo" style="color:#fff" title="檔案資訊">ℹ️ 資訊</button><a id="vdlj" class="btn" hidden title="下載轉好的 JPG 版本（不能開 HEIC 的裝置用這個）">JPG</a><a id="vdl" class="btn">下載</a><button class="ghost" id="vclose" style="color:#fff">✕</button></div></div>
  <div id="vstage"></div>
  <div id="vinfop" hidden></div>
  <button class="vnav" id="vprev" aria-label="上一個">‹</button><button class="vnav" id="vnext" aria-label="下一個">›</button>
</div>
<div id="modal" hidden><div class="mbox card" id="mbox"></div></div>
<div id="selbar" hidden>
  <b id="selcount">已選 0 個</b>
  <button class="ghost" id="selall">全選</button>
  <button class="ghost" id="selnone">清除選取</button>
  <button id="seldl">下載選取</button>
  <button id="selshare" hidden>🔗 分享選取</button>
  <button class="danger" id="seldel" hidden>刪除選取</button>
  <button class="ghost" id="selexit">完成</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);let me=null,API='',folders=[];
const sb=supabase.createClient(NAS_CONFIG.supabaseUrl,NAS_CONFIG.supabaseAnonKey);
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
// totals: GB from 1 GB up, otherwise MB
const fmtTotal=n=>n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>0&&n<104858?'<0.1 MB':(n/1048576).toFixed(1)+' MB';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
// device name: user-editable, remembered per browser
function guessDevice(){const u=navigator.userAgent;
  return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows 電腦':/Mac/.test(u)?'Mac':'未命名裝置'}
let device=ls.get('nas_device')||guessDevice();
const opened=new Set(JSON.parse(ls.get('nas_open')||'[]')); // folders start collapsed; only the ones you expanded stay open
async function token(){const{data}=await sb.auth.getSession();return data.session?.access_token}
async function findApi(){ // the PC's tunnel URL is published to url.json by start.ps1
  try{const r=await fetch('url.json?t='+Date.now());API=(await r.json()).url.replace(/\/$/,'')}catch{API=''}
}
async function api(path,o={}){
  if(!API)await findApi();
  const t=await token();
  o.headers=Object.assign({Authorization:'Bearer '+t},o.headers||{});
  try{return await fetch(API+path,o)}
  catch{await findApi();return fetch(API+path,o)} // tunnel may have restarted
}
async function init(){
  $('#dev').textContent=device;
  const t=await token();
  if(!t){$('#login').hidden=false;$('#app').hidden=true;return}
  $('#login').hidden=true;$('#app').hidden=false;
  let r;try{r=await api('/api/me')}catch{$('#off').hidden=false;return}
  if(!r.ok){$('#off').hidden=r.status===401;if(r.status===401){await sb.auth.signOut();return init()}return}
  $('#off').hidden=true;me=await r.json();$('#who').textContent=me.name+(me.admin?'（管理員）':'');
  $('#setpw').hidden=$('#shares').hidden=$('#vshare').hidden=$('#vdel').hidden=!me.admin;refresh();
}
$('#go').onclick=async()=>{
  const{error}=await sb.auth.signInWithPassword({email:$('#u').value.trim(),password:$('#p').value});
  if(error)$('#err').textContent='帳號或密碼錯誤';else{$('#err').textContent='';init()}
};
$('#p').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#rename').onclick=()=>{const n=prompt('這台裝置的名稱（上傳預設會存到同名資料夾）',device);
  if(n&&n.trim()){device=n.trim();ls.set('nas_device',device);$('#dev').textContent=device;target=device;drawTarget()}};
let target=device;
function drawTarget(){
  const names=[...new Set([device,...folders.map(f=>f.name)])];
  if(!names.includes(target))target=device;
  $('#target').innerHTML=names.map(n=>`<option value="${esc(n)}"${n===target?' selected':''}>${esc(n)}${n===device?'（此裝置）':''}</option>`).join('');
}
$('#target').onchange=e=>target=e.target.value;
// view mode and sorting, remembered per browser ('grid' was the removed large-icon view -> medium)
const savedView=ls.get('nas_view');
let view=['list','nine','small'].includes(savedView)?savedView:'nine',sortBy=['name','date','size'].includes(ls.get('nas_sort'))?ls.get('nas_sort'):'date',asc=ls.get('nas_asc')==='1',lastSig='';
const cmpName=(a,b)=>a.name.localeCompare(b.name,'zh-Hant',{numeric:true});
const CMP={name:cmpName,date:(a,b)=>a.mtime-b.mtime,size:(a,b)=>a.size-b.size};
const dir=n=>(asc?1:-1)*n;
const sortFiles=fs=>[...fs].sort((a,b)=>dir(CMP[sortBy](a,b))||cmpName(a,b));
// Folder order: pinned folders first; then the manual order if one has been set (drag to arrange, shared by all devices);
// otherwise the sort rule above: by name, by newest file, or by total size. New folders without a manual position go last.
const manualOrder=()=>folders.some(f=>!f.pinned&&f.rank>=0);
function sortFolders(){
  const key=f=>sortBy==='date'?Math.max(0,...f.files.map(x=>x.mtime)):f.files.reduce((s,x)=>s+x.size,0);
  const manual=manualOrder(),rk=f=>f.rank<0?1e9:f.rank;
  return [...folders].sort((a,b)=>{
    if(a.pinned!==b.pinned)return b.pinned-a.pinned; // pinned group first, newest pin on top (its own order, changed by dragging)
    if(a.pinned)return a.pinRank-b.pinRank;
    return manual?(rk(a)-rk(b)||cmpName(a,b)):sortBy==='name'?dir(cmpName(a,b)):dir(key(a)-key(b))||cmpName(a,b);
  });
}
function syncToolbar(){
  for(const[v,id]of[['list','#vlist'],['nine','#vnine'],['small','#vsmall']])$(id).classList.toggle('on',view===v);
  $('#sort').value=sortBy;$('#order').textContent=asc?'↑ 由小到大':'↓ 由大到小';
}
const setPref=()=>{ls.set('nas_view',view);ls.set('nas_sort',sortBy);ls.set('nas_asc',asc?'1':'0');syncToolbar();render(true)};
$('#vlist').onclick=()=>{view='list';setPref()};$('#vnine').onclick=()=>{view='nine';setPref()};$('#vsmall').onclick=()=>{view='small';setPref()};

async function deleteItems(items,msg){ // admin only; the server checks too. One edit-password prompt covers the whole batch.
  if(!me.admin||!items.length||!confirm(msg))return;
  const pw=prompt('請輸入編輯密碼');if(pw===null)return;
  const r=await api('/api/delete-files',{method:'POST',headers:{'X-Edit-Password':pw},body:JSON.stringify({items})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){alert(j.error||'刪除失敗');return false}

async function togglePin(name){
  const f=folders.find(x=>x.name===name);if(!f)return;
  const pinned=folders.filter(x=>x.pinned).sort((a,b)=>a.pinRank-b.pinRank).map(x=>x.name).filter(n=>n!==name);
  if(!f.pinned)pinned.unshift(name); // newly pinned goes to the very top
  await saveFolderPrefs({pinned});
}

// The dragged card follows the pointer (translateY), the other cards slide out of its way (FLIP animation), and on release it settles into its slot.
let drag=null;
function dragFrame(){
  const d=drag;if(!d)return;
  const c=d.card,want=d.y-d.grab; // where the card's top edge should be on screen
  const same=[...document.querySelectorAll('#list details.fold')].filter(x=>x!==c&&x.dataset.pinned===c.dataset.pinned); // can't cross the pinned boundary: use the pin button for that
  c.style.transform='';
  const center=want+c.getBoundingClientRect().height/2;
  const v0=new Map(same.map(x=>[x,x.getBoundingClientRect().top])); // where each neighbour is drawn right now
  let moved=false;
  for(const x of same){ // passing a neighbour's midpoint swaps places with it
    const r=x.getBoundingClientRect(),mid=r.top+r.height/2,after=c.compareDocumentPosition(x)&Node.DOCUMENT_POSITION_FOLLOWING;
    if(after&&center>mid){x.after(c);moved=true}else if(!after&&center<mid){x.before(c);moved=true}
  }
  if(moved){
    d.moved=true;
    for(const x of same){ // FLIP: neighbours start where they were drawn, then glide to their new slot
      x.style.transition='none';x.style.transform='';
      const dy=v0.get(x)-x.getBoundingClientRect().top;
      if(Math.abs(dy)>1){x.style.transform=`translateY(${dy}px)`;x.getBoundingClientRect();x.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';x.style.transform=''}
      else x.style.transition='';
    }
  }
  const nat=c.getBoundingClientRect().top; // its slot in the list (transform cleared above)
  c.style.transform=`translateY(${want-nat}px) scale(1.02)`;
}
function dragTick(){
  if(!drag)return;
  const y=drag.y,edge=90; // near the top/bottom edge the page scrolls by itself
  if(y<edge)scrollBy(0,-Math.min(18,(edge-y)/4+4));else if(y>innerHeight-edge)scrollBy(0,Math.min(18,(y-(innerHeight-edge))/4+4));
  dragFrame();requestAnimationFrame(dragTick);
}
const dragMove=e=>{if(drag&&e.pointerId===drag.id){drag.y=e.clientY;dragFrame()}}; // update right away on every move; the frame loop below only handles auto-scrolling at the edges
async function dragEnd(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  const d=drag;drag=null;
  removeEventListener('pointermove',dragMove);removeEventListener('pointerup',dragEnd);removeEventListener('pointercancel',dragEnd);
  const c=d.card;
  c.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';c.style.transform='translateY(0) scale(1)'; // settle into the slot
  await new Promise(r=>setTimeout(r,200));
  for(const x of document.querySelectorAll('#list details.fold')){x.style.transition='';x.style.transform=''}
  c.classList.remove('dragging');document.body.classList.remove('dragmode');
  if(!d.moved)return;
  const pinnedGroup=c.dataset.pinned==='1';
  const names=[...document.querySelectorAll('#list details.fold')].filter(x=>(x.dataset.pinned==='1')===pinnedGroup).map(x=>x.dataset.f);
  await saveFolderPrefs(pinnedGroup?{pinned:names}:{order:names});
}
$('#list').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g||!me?.admin)return;
  e.preventDefault();
  const card=g.closest('details.fold');
  document.body.classList.add('dragmode');card.classList.add('dragging'); // bodies collapse while dragging so the cards are easy to move around
  const r=card.getBoundingClientRect();
  drag={card,id:e.pointerId,y:e.clientY,grab:Math.min(Math.max(e.clientY-r.top,0),r.height),moved:false}; // grab = where on the card the finger holds it
  addEventListener('pointermove',dragMove);addEventListener('pointerup',dragEnd);addEventListener('pointercancel',dragEnd);
  dragFrame();requestAnimationFrame(dragTick);
});
$('#list').onclick=async e=>{
  if(e.target.closest('.grip')){e.preventDefault();return} // grabbing the handle must not expand/collapse the folder
  const b=e.target.closest('button');
  if(b){
    if(b.dataset.selfolder){e.preventDefault();return selectFolder(b.dataset.selfolder)}
    if(b.dataset.pin){e.preventDefault();return togglePin(b.dataset.pin)}
    if(b.dataset.sharefolder){e.preventDefault();const n=b.dataset.sharefolder;return shareDialog(`資料夾「${n}」（${folders.find(f=>f.name===n)?.files.length||0} 個檔案，之後新增的檔案也會出現在分享裡）`,{folder:n})}
    if(b.dataset.sharefile){const k=b.dataset.sharefile;return shareDialog(`檔案「${splitKey(k).name}」`,{items:[splitKey(k)]})}
    if(b.dataset.delfolder){e.preventDefault();return delFolder(b.dataset.delfolder)}
    if(b.dataset.n)return deleteItems([{folder:b.dataset.f,name:b.dataset.n}],`確定要刪除「${b.dataset.n}」嗎？`);
    return;
  }
  if(selMode&&!e.target.closest('a.btn')){ // in select mode a tap toggles the item instead of opening it
    const it=e.target.closest('[data-k]');
    if(it){e.preventDefault();setSel(it.dataset.k,!selected.has(it.dataset.k));updateSelUI()}
    return;
  }
  const a=e.target.closest('a[data-open]');
  if(a&&!(e.ctrlKey||e.metaKey||e.shiftKey)){e.preventDefault();openViewer(a.dataset.open)} // preview in the page (ctrl/cmd-click still opens a new tab)
};

async function copyText(text,btn){
  try{await navigator.clipboard.writeText(text)}catch{const i=document.createElement('input');i.value=text;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove()}
  if(btn){const o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent=o,1500)}
}
function shareDialog(label,payload){
  showModal(`<h3>🔗 建立分享連結</h3><p class="sub">分享內容：${esc(label)}<br>對方<b>不需要登入</b>，開啟連結後就能<b>檢視與下載</b>（唯讀，看不到其他檔案）。</p>
    <label>分享密碼（選填：不設密碼就留空；要設的話至少 4 個字元，只用於這一個連結）</label><input id="sp1" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="留空 = 不設密碼">
    <label>再輸入一次</label><input id="sp2" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false">
    <div class="mwarn" id="nopw" hidden style="margin:6px 0 0">⚠️ 沒有設密碼：任何拿到連結的人都能開啟，請只傳給你信任的人。</div>
    <label>連結有效期限</label>
    <select id="sexp"><option value="1h">1 小時</option><option value="6h">6 小時</option><option value="1d">1 天</option><option value="7d" selected>7 天</option><option value="30d">30 天</option><option value="never">永久（可隨時撤銷）</option><option value="custom">自訂…</option></select>
    <div id="scustom" hidden style="display:none;gap:6px;margin-top:6px;align-items:center"><input id="sn" type="text" inputmode="numeric" placeholder="數字" style="width:90px;margin:0"><select id="su"><option value="h">小時</option><option value="d" selected>天</option></select></div>
    <p class="merr" id="serr"></p>
    <div class="mbtns"><button id="smk">建立分享連結</button><button class="ghost" id="scancel">取消</button></div>`);
  $('#scancel').onclick=closeModal;$('#sp1').focus();
  const syncForm=()=>{$('#nopw').hidden=!!($('#sp1').value||$('#sp2').value);const c=$('#sexp').value==='custom';$('#scustom').style.display=c?'flex':'none';if(c)$('#sn').focus()};
  $('#sp1').oninput=$('#sp2').oninput=syncForm;$('#sexp').onchange=syncForm;syncForm();
  $('#smk').onclick=async()=>{
    const p1=$('#sp1').value,p2=$('#sp2').value;
    if(p1||p2){ // a password is optional; if given it needs 4+ characters and must match
      if(p1.length<4)return $('#serr').textContent='密碼至少要 4 個字元（或留空不設密碼）';
      if(p1!==p2)return $('#serr').textContent='兩次輸入的密碼不一樣';
    }
    let hours;const ev=$('#sexp').value; // lifetime in hours; 0 = never
    if(ev==='never')hours=0;
    else if(ev==='custom'){
      const n=Number($('#sn').value.trim());
      if(!Number.isFinite(n)||n<=0||!/^\d+(\.\d+)?$/.test($('#sn').value.trim()))return $('#serr').textContent='請輸入大於 0 的數字';
      hours=n*($('#su').value==='d'?24:1);
      if(hours>24*3650)return $('#serr').textContent='有效期限最長 3650 天';
    }else hours=ev.endsWith('h')?parseInt(ev):parseInt(ev)*24;
    $('#smk').disabled=true;$('#serr').textContent='';
    const r=await api('/api/share/create',{method:'POST',body:JSON.stringify({...payload,password:p1,expiresHours:hours})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){$('#smk').disabled=false;return $('#serr').textContent=j.error||'建立失敗'}
    const url=shareUrl(j.id);
    showModal(`<h3>✅ 分享連結已建立</h3><p class="sub">分享內容：${esc(label)}</p>
      <label>分享連結</label><input id="slink" type="text" readonly value="${esc(url)}">
      <div class="mbtns"><button id="scopy">複製連結</button>${navigator.share?'<button class="ghost" id="sshare">用其他 App 傳送…</button>':''}<button class="ghost" id="sdone">完成</button></div>
      <div class="mwarn">${p1?'請<b>另外</b>把密碼告訴對方（不要和連結放在同一則訊息）。密碼會加密保存在你的電腦上，之後可以到頁面頂端的「🔗 已分享連結」，輸入編輯密碼後再查看。':'這個分享<b>沒有設密碼</b>：任何拿到連結的人都能開啟，請只傳給你信任的人。不放心的話，可以到頁面頂端的「🔗 已分享連結」隨時撤銷。'}</div>`);
    $('#slink').onfocus=e=>e.target.select();
    $('#scopy').onclick=e=>copyText(url,e.target);$('#sdone').onclick=closeModal;
    if($('#sshare'))$('#sshare').onclick=()=>navigator.share({title:'檔案分享',url}).catch(()=>{});
    if(selMode){selected.clear();selMode=false;render(true)}
  };
}
async function sharesManager(){ // every share: link, password (after entering the edit password), expiry, usage; copy / revoke

      const inner=x.thumb?`<img class="ico" loading="lazy" decoding="async" data-k="${x.kind}" src="${API+x.thumb}" alt="" onerror="thumbErr(this)">`:`<div class="ico">${ICON[x.kind]}</div>`;
      return `<a class="sc" href="#" data-pv="${esc(k)}" data-sid="${esc(s.id)}" title="${esc(x.name)}">${inner}${x.kind==='video'?'<span class="play">▶</span>':''}</a>`}).join('')}${keys.length>MAX?`<span class="sub" style="align-self:center;margin:0 4px">+${keys.length-MAX} 個</span>`:''}</div>`;
  };
  const pwCell=s=>!s.hasPassword?'<span style="color:#b45309">（沒有設密碼：任何人有連結就能開啟）</span>':!s.pwStored?'<span style="color:var(--mut)">（未儲存）</span>':revealed?(revealed[s.id]==null?'<span style="color:var(--mut)">（無法解密）</span>':`<code style="user-select:all;font-size:15px">${esc(revealed[s.id])}</code> <button class="ghost" data-copypw="${esc(s.id)}" style="padding:2px 8px">複製密碼</button>`):'<code>••••••••</code>';
  const draw=()=>{
    showModal(`<h3>🔗 已分享連結（${list.length}）</h3><p class="sub">對方開啟連結（有設密碼的要先輸入密碼）後可檢視與下載，唯讀。點縮圖可以直接預覽。撤銷後連結立刻失效，對方已經打開的下載連結也一併失效。密碼要輸入編輯密碼才會顯示。</p>
      ${list.some(s=>s.hasPassword)?`<div class="mbtns" style="margin:0 0 6px">${revealed?'<button class="ghost" data-hide="1">🙈 隱藏密碼</button>':'<button data-reveal="1">🔑 顯示密碼</button>'}</div>`:''}`+
      (list.length?list.map(s=>`<div class="srow"><b>${s.type==='folder'?'📁 資料夾「'+esc(s.folder)+'」· '+s.count+' 個檔案（即時）':'📄 '+s.count+' 個檔案'}</b>
        ${thumbs(s)}
        <small>建立 ${when(s.created)} · 已開啟 ${s.opens} 次${s.lastOpen?'（最近 '+when(s.lastOpen)+'）':''}</small>
        <div style="display:flex;gap:6px;margin:4px 0"><input type="text" readonly value="${esc(shareUrl(s.id))}" onfocus="this.select()" style="flex:1;min-width:0;padding:6px 8px;font-size:12px;margin:0"><button class="ghost" data-copy="${esc(s.id)}" style="padding:4px 10px;white-space:nowrap">複製連結</button></div>
        <div style="margin:4px 0">密碼：${pwCell(s)}</div>
        <div style="margin:4px 0">有效期限：${s.expires?when(s.expires)+'（'+left(s.expires)+'）':'永久有效'}</div>
        <button class="del" data-revoke="${esc(s.id)}" style="margin-top:4px">撤銷這個分享</button></div>`).join(''):'<p class="sub">目前沒有任何分享。</p>')+
      '<div class="mbtns"><button class="ghost" id="sx">關閉</button></div>');
    $('#sx').onclick=closeModal;
    $('#mbox').onclick=async e=>{
      const pv=e.target.closest('a[data-pv]');
      if(pv){e.preventDefault();return openViewer(pv.dataset.pv,keyMap[pv.dataset.sid])} // preview opens on top of this dialog
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.copy)return copyText(shareUrl(b.dataset.copy),b);
      if(b.dataset.copypw)return copyText(revealed[b.dataset.copypw],b);
      if(b.dataset.hide){revealed=null;return draw()}
      if(b.dataset.reveal){
        const pw=prompt('請輸入編輯密碼，以顯示分享密碼');if(pw===null)return;
        const rr=await api('/api/shares/reveal',{method:'POST',headers:{'X-Edit-Password':pw}});
        const j=await rr.json().catch(()=>({}));
        if(!rr.ok)return alert(j.error||'無法顯示');
        revealed=j.passwords;return draw();
      }
      if(b.dataset.revoke&&confirm('確定要撤銷這個分享連結嗎？撤銷後對方就無法再開啟。')){
        const rr=await api('/api/share?id='+encodeURIComponent(b.dataset.revoke),{method:'DELETE'});
        if(!rr.ok)return alert((await rr.json().catch(()=>({}))).error||'撤銷失敗');
        try{await load();draw()}catch{closeModal()}
      }
    };
  };
  draw();
}
$('#shares').onclick=sharesManager;
$('#selshare').onclick=()=>{const items=[...selected].map(splitKey);if(items.length)shareDialog(`${items.length} 個檔案`,{items})};
$('#vshare').onclick=()=>{const k=vlist[vi]?.k;if(k)shareDialog(`檔案「${splitKey(k).name}」`,{items:[splitKey(k)]})};
$('#vdel').onclick=async()=>{ // admin: delete the file being previewed (confirm + edit password), then move on to the next one
  const k=vlist[vi]?.k;if(!k)return;
  const{folder,name}=splitKey(k);
  if(!await deleteItems([{folder,name}],`確定要刪除「${name}」嗎？此動作無法復原。`))return;
  vlist.splice(vi,1);
  if(!vlist.length)return closeViewer();
  vi=Math.min(vi,vlist.length-1);showViewer();
};

// ---- in-page preview: images, video, audio, PDF, text; prev/next within the folder ----
let vlist=[],vi=0,vseq=0,vOpen=false;
const extOf=n=>(n.match(/\.([^.]+)$/)||[])[1]?.toLowerCase()||'';
function openViewer(k,keys){ // keys = an explicit list to browse (e.g. the files of one share); default = the file's folder in the current sort order
  if(keys)vlist=keys.map(kk=>({k:kk,x:fileByKey(kk)})).filter(i=>i.x);
  else{const{folder}=splitKey(k),f=folders.find(f=>f.name===folder);if(!f)return;vlist=sortFiles(f.files).map(x=>({k:keyOf(folder,x.name),x}))}
  vi=Math.max(0,vlist.findIndex(i=>i.k===k));if(!vlist.length)return;
  $('#modal').classList.remove('top'); // a preview opened from a dialog sits above it
  if(!vOpen){vOpen=true;history.pushState({viewer:1},'')} // so the phone's back button closes the preview instead of leaving the site
  $('#viewer').hidden=false;document.body.style.overflow='hidden';showViewer();
}
function stopMedia(){for(const m of $('#vstage').querySelectorAll('video,audio')){m.pause();m.removeAttribute('src');m.load()}}
// file info panel (the ℹ️ button): facts about the file being previewed; size/resolution/length come from the file itself once it has loaded
let vmeta={};
const fmtDur=s=>{if(!Number.isFinite(s))return'';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
const TYPES={image:'圖片',video:'影片'};
function renderInfo(){
  const p=$('#vinfop');if(p.hidden||!vlist[vi])return;
  $('#viewer').style.setProperty('--vbar',document.querySelector('.vtop').getBoundingClientRect().bottom+6+'px'); // the toolbar can be one or two rows tall (and float with margins on iOS): keep the panel just below it
  const{k,x}=vlist[vi],{folder}=splitKey(k),ext=extOf(x.name),label=x.kind in TYPES?TYPES[x.kind]:ext==='mp3'||ext==='wav'?'音訊':ext==='pdf'?'PDF 文件':ext==='txt'?'文字檔':'檔案';
  const rows=[['名稱',x.name],['資料夾',folder],['類型',label+(ext?'（'+ext.toUpperCase()+'）':'')],['大小',fmt(x.size)],
    ['更新日期',new Date(x.mtime).toLocaleString()]];
  if(x.uploaded)rows.push(['上傳時間',new Date(x.uploaded).toLocaleString()]);
  if(x.owner&&x.owner!=='?')rows.push(['上傳者',x.owner]);
  if(vmeta.w&&vmeta.h)rows.push(['解析度',`${vmeta.w} × ${vmeta.h}（${(vmeta.w*vmeta.h/1e6).toFixed(1)} MP）`]);
  if(vmeta.dur)rows.push(['長度',fmtDur(vmeta.dur)]);
  if(x.preview)rows.push(['備註','HEIC 照片：預覽使用轉好的 JPG，下載的是原檔']);
  p.innerHTML='<h4>ℹ️ 檔案資訊</h4>'+rows.map(([a,b])=>`<div class="ir"><span class="ik">${a}</span><span class="iv">${esc(b)}</span></div>`).join('');
}
$('#vinfo').onclick=()=>{const p=$('#vinfop');p.hidden=!p.hidden;renderInfo()};
function showViewer(){
  const{x}=vlist[vi],seq=++vseq,st=$('#vstage'),u=API+x.url,ext=extOf(x.name);
  stopMedia();st.innerHTML='';vmeta={};renderInfo();
  $('#vtitle').textContent=x.name;$('#vpos').textContent=`${vi+1} / ${vlist.length}`;$('#vdl').href=u+'&dl=1';
  $('#vdlj').hidden=!x.preview;if(x.preview)$('#vdlj').href=API+x.preview+'&dl=1'; // HEIC/HEIF: the browser shows the JPEG copy; "下載" still gives the untouched original
  $('#vprev').hidden=$('#vnext').hidden=vlist.length<2;
  const msg=(html,cls)=>{const d=document.createElement('div');d.className='vmsg '+(cls||'');d.innerHTML=html;st.append(d);return d};
  if(x.kind==='image'){
    const img=document.createElement('img');img.className='vimg';img.alt=x.name;
    if(x.thumb)img.src=API+x.thumb; // 720p version shows instantly, the original replaces it when loaded
    st.append(img);
    const full=new Image();full.onload=()=>{if(seq===vseq){img.src=full.src;vmeta={w:full.naturalWidth,h:full.naturalHeight};renderInfo()}};full.onerror=()=>{if(seq===vseq&&!x.thumb)img.replaceWith(Object.assign(document.createElement('div'),{className:'vmsg warn',textContent:x.preview?'無法轉換這張照片來預覽，請按右上角「下載」取得原檔':'無法載入圖片'}))};full.src=x.preview?API+x.preview:u;
  }else if(x.kind==='video'){
    const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';if(x.thumb)v.poster=API+x.thumb;
    v.addEventListener('error',()=>{if(seq===vseq&&v.getAttribute('src'))msg('這個瀏覽器無法播放此影片格式（例如 iPhone 的 HEVC .mov），請按右上角「下載」後用播放器開啟。','warn')});
    v.addEventListener('loadedmetadata',()=>{if(seq===vseq){vmeta={w:v.videoWidth,h:v.videoHeight,dur:v.duration};renderInfo()}});
    v.src=u;st.append(v);v.play().catch(()=>{}); // autoplay may be refused; the controls are there
  }else if(ext==='mp3'||ext==='wav'){
    msg('<div class="big">🎵</div>'+esc(x.name));const a=document.createElement('audio');a.controls=true;a.addEventListener('loadedmetadata',()=>{if(seq===vseq){vmeta={dur:a.duration};renderInfo()}});a.src=u;st.append(a);a.play().catch(()=>{});
  }else if(ext==='pdf'){
    const fr=document.createElement('iframe');fr.src=u;st.append(fr); // some phone browsers can't show PDFs inline: use the download button then
  }else if(ext==='txt'){
    msg('載入中…');
    fetch(u).then(r=>r.text()).then(t=>{if(seq!==vseq)return;st.innerHTML='';const p=document.createElement('pre');p.textContent=t.length>300000?t.slice(0,300000)+'\n\n…（內容過長，只顯示前 300KB）':t;st.append(p)}).catch(()=>{if(seq===vseq){st.innerHTML='';msg('無法載入文字內容','warn')}});
  }else msg(`<div class="big">📄</div>${esc(x.name)}<br>${fmt(x.size)}<br>此檔案類型無法預覽，請按右上角「下載」。`);
}
function closeViewer(fromPop){
  if(!vOpen)return;vOpen=false;vseq++;stopMedia();$('#vstage').innerHTML='';$('#viewer').hidden=true;$('#vinfop').hidden=true;document.body.style.overflow='';
  if(!fromPop&&history.state?.viewer)history.back();
}
const vgo=d=>{if(vlist.length<2)return;vi=(vi+d+vlist.length)%vlist.length;showViewer()};
$('#vclose').onclick=()=>closeViewer();$('#vprev').onclick=()=>vgo(-1);$('#vnext').onclick=()=>vgo(1);
$('#vstage').onclick=e=>{if(e.target.id==='vstage')closeViewer()};
addEventListener('popstate',()=>closeViewer(true));
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden&&$('#modal').classList.contains('top')){if(e.key==='Escape')closeModal();return} // a dialog above the preview owns the keyboard (arrow keys in its fields must not flip files behind it)
  if(!vOpen)return;if(e.key==='Escape'){if(!$('#vinfop').hidden)$('#vinfop').hidden=true;else closeViewer()}else if(e.key==='ArrowLeft')vgo(-1);else if(e.key==='ArrowRight')vgo(1)});
let tx=0,ty=0; // swipe left/right to move between files
$('#vstage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#vstage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&!e.target.closest('video,audio,iframe,pre'))vgo(dx<0?1:-1)},{passive:true});

async function delFolder(name){
  if(!me.admin)return;
  if(!confirm(`確定要刪除資料夾「${name}」以及裡面所有檔案嗎？此動作無法復原。`))return;
  const pw=prompt('請輸入編輯密碼');if(pw===null)return;
  const r=await api('/api/folder?name='+encodeURIComponent(name),{method:'DELETE',headers:{'X-Edit-Password':pw}});
  if(!r.ok)alert((await r.json()).error);refresh();
}
$('#newf').onclick=async()=>{
  const n=prompt('新資料夾名稱');if(!n||!n.trim())return;
  const r=await api('/api/folder?name='+encodeURIComponent(n.trim()),{method:'POST'});
  if(!r.ok)alert((await r.json()).error);else{target=(await r.json()).name;refresh()}
};
$('#setpw').onclick=async()=>{
  let cur='';
  if(me.hasEditPassword){cur=prompt('請輸入目前的編輯密碼');if(cur===null)return}
  const nw=prompt('設定新的編輯密碼（至少 4 個字元）');if(nw===null)return;
  const r=await api('/api/edit-password',{method:'PUT',body:JSON.stringify({current:cur,new:nw})});
  if(r.ok){me.hasEditPassword=true;alert('編輯密碼已更新')}else alert((await r.json()).error);
};
// Uploads run through a queue (2 at a time) with automatic retry; failures show a reason + retry button.
const queue=[];let running=0;const MAX_PAR=2,MAX_TRY=3;
function enqueue(file,folder){
  const d=document.createElement('div');d.className='card';d.style.marginBottom='8px';
  d.innerHTML=`<div>${esc(file.name)} → ${esc(folder)} <small class="s">等待中</small> <button class="ghost rt" hidden style="padding:2px 8px">重試</button></div><div class="prog"><i></i></div>`;
  $('#ups').prepend(d);
  const job={file,folder,d,tries:0};
  d.querySelector('.rt').onclick=()=>{d.querySelector('.rt').hidden=true;job.tries=0;queue.push(job);pump()};
  queue.push(job);pump();
}
function pump(){while(running<MAX_PAR&&queue.length){running++;runJob(queue.shift()).finally(()=>{running--;pump()})}}
// Files go up in 48MB pieces (stays under Cloudflare's per-request size cap); a dropped connection resumes from the last byte the PC has.
const CHUNK=48*1024*1024;
const newId=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function sendChunk(j,offset,onprog){
  if(!API)await findApi();const t=await token();
  return new Promise(res=>{
    const x=new XMLHttpRequest();
    x.open('PUT',`${API}/api/upload-chunk?folder=${encodeURIComponent(j.folder)}&name=${encodeURIComponent(j.file.name)}&id=${j.id}&offset=${offset}&total=${j.file.size}&mtime=${j.file.lastModified||0}`);
    x.setRequestHeader('Authorization','Bearer '+t);
    x.upload.onprogress=e=>onprog(e.loaded);
    x.onload=()=>{let b={};try{b=JSON.parse(x.responseText)}catch{}res({status:x.status,body:b})};
    x.onerror=()=>res({status:0});x.ontimeout=()=>res({status:0});
    x.send(j.file.slice(offset,Math.min(offset+CHUNK,j.file.size)));
  });
}
async function runJob(j){
  const s=j.d.querySelector('.s'),bar=j.d.querySelector('i'),total=j.file.size;
  j.id=j.id||newId();j.offset=j.offset||0;
  const show=(done,note)=>{const p=total?Math.min(100,done/total*100):100;bar.style.width=p+'%';s.textContent=Math.round(p)+'%'+(note||'')};
  let fails=0;
  if(j.offset>0){const r=await api(`/api/upload-status?folder=${encodeURIComponent(j.folder)}&id=${j.id}`).catch(()=>null);if(r?.ok)j.offset=(await r.json()).received}
  while(true){
    show(j.offset,fails?`（重試 ${fails}/${MAX_TRY}）`:'');
    const r=await sendChunk(j,j.offset,l=>show(j.offset+l,fails?`（重試 ${fails}/${MAX_TRY}）`:''));
    if(r.status===200&&(r.body.done||Number.isFinite(r.body.received))){
      fails=0;
      if(r.body.done){j.d.remove();refresh();return}
      j.offset=r.body.received;continue;
    }
    if(r.status===409){j.offset=r.body.received;continue} // server has a different amount; resync
    if(r.status===401){s.textContent='失敗：登入過期，請重新整理頁面';break}
    const why=r.status?`伺服器回應 ${r.status}`+(r.body?.error?`（${r.body.error}）`:''):'網路中斷或連不到主機';
    if(++fails>MAX_TRY){s.textContent='失敗：'+why;break}
    s.textContent=`${why}，重試中 ${fails}/${MAX_TRY}`;
    await new Promise(r=>setTimeout(r,2000*fails));await findApi(); // tunnel may have restarted
    const st=await api(`/api/upload-status?folder=${encodeURIComponent(j.folder)}&id=${j.id}`).catch(()=>null);
    if(st?.ok)j.offset=(await st.json()).received; // resume from what the PC actually has
  }
  j.d.querySelector('.rt').hidden=false;
}
const pick=fl=>{const f=target;[...fl].forEach(x=>enqueue(x,f))};
$('#drop').onclick=()=>$('#f').click();$('#f').onchange=e=>{pick(e.target.files);e.target.value=''};
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};
$('#drop').ondragleave=()=>$('#drop').classList.remove('over');
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('over');pick(e.dataTransfer.files)};

// ---- install as an app (same idea as the ledger app) ----
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const syncInstall=()=>{$('#install').hidden=isStandalone()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;syncInstall()});
addEventListener('appinstalled',()=>{deferredInstall=null;syncInstall()});
$('#install').onclick=()=>{
  if(deferredInstall){deferredInstall.prompt();deferredInstall=null}
  else alert(/iPhone|iPad/.test(navigator.userAgent)?'iPhone / iPad：點 Safari 下方的「分享」→「加入主畫面」':'請用瀏覽器選單裡的「安裝應用程式」或「加入主畫面」');
};
syncInstall();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

setInterval(()=>{if(me&&!document.hidden&&!vOpen)refresh()},10000);
init();
